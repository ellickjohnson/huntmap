<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HuntMap — Admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui,-apple-system,sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:24px; }
  header { display:flex; align-items:center; justify-content:space-between; max-width:960px; margin:0 auto 24px; }
  h1 { font-size:22px; margin:0; }
  .badge { background:#0f766e; color:#fff; padding:4px 10px; border-radius:6px; font-size:12px; }
  a.back { color:#5eead4; text-decoration:none; font-size:14px; }
  .wrap { max-width:960px; margin:0 auto; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:20px; }
  .card h2 { margin:0 0 14px; font-size:17px; color:#f1f5f9; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  label { font-size:12px; color:#94a3b8; display:block; margin-bottom:4px; }
  input,select {
    background:#0f172a; border:1px solid #334155; color:#f1f5f9;
    padding:10px; border-radius:8px; font-size:14px; width:100%;
  }
  input:focus,select:focus { outline:2px solid #0f766e; border-color:transparent; }
  .btn { background:#0f766e; color:#fff; border:0; padding:10px 18px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:hover { background:#0d9488; }
  .btn.ghost { background:transparent; border:1px solid #475569; color:#94a3b8; }
  .btn.danger { background:#b91c1c; }
  .btn.small { padding:6px 12px; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:#94a3b8; font-size:12px; text-transform:uppercase; letter-spacing:.05em; padding:8px; border-bottom:1px solid #334155; }
  td { padding:10px 8px; border-bottom:1px solid #1e293b; }
  .pill { padding:2px 10px; border-radius:99px; font-size:11px; font-weight:600; }
  .pill.admin { background:#7c2d12; color:#fdba74; }
  .pill.user { background:#164e63; color:#67e8f9; }
  .pill.yes { background:#14532d; color:#86efac; }
  .pill.no { background:#7f1d1d; color:#fca5a5; }
  .msg { padding:10px; border-radius:8px; font-size:13px; display:none; margin-top:12px; }
  .msg.error { background:#7f1d1d33; color:#fca5a5; }
  .msg.ok { background:#14532d33; color:#86efac; }
  .row-actions { display:flex; gap:6px; }
  dialog { background:#1e293b; color:#e2e8f0; border:1px solid #334155; border-radius:12px; padding:24px; max-width:420px; width:90%; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  .muted { color:#64748b; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🦌 HuntMap Admin <span class="badge" id="whoami"></span></h1>
  <a class="back" href="/">← Back to map</a>
</header>

<div class="card">
  <h2>SMTP settings <span class="muted">(verification + system emails)</span></h2>
  <div class="grid">
    <div><label>SMTP host</label><input id="s_host" placeholder="mx.ellickjohnson.net"></div>
    <div><label>Port</label><input id="s_port" type="number" placeholder="587"></div>
    <div><label>TLS mode</label><select id="s_tls">
      <option value="starttls">STARTTLS</option><option value="ssl">SSL/TLS</option><option value="none">None</option>
    </select></div>
    <div><label>Username</label><input id="s_user" placeholder="signups@autonode.co"></div>
    <div><label>Password</label><input id="s_pw" type="password" placeholder="leave = keep current"></div>
    <div><label>From address</label><input id="s_from" placeholder="signups@autonode.co"></div>
  </div>
  <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
    <button class="btn" id="saveSmtp">Save settings</button>
    <button class="btn ghost" id="testSmtp">Send test email</button>
    <input id="test_to" placeholder="send test to…" style="max-width:240px">
  </div>
  <div class="msg" id="smtpMsg"></div>
</div>

<div class="card">
  <h2>Users</h2>
  <table>
    <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Verified</th><th>Created</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody id="userRows"></tbody>
  </table>
  <div class="msg" id="userMsg"></div>
</div>

<dialog id="editDlg">
  <h2 style="margin:0 0 16px;font-size:17px">Edit user</h2>
  <input type="hidden" id="e_id">
  <label>Email</label><input id="e_email" disabled style="margin-bottom:12px">
  <label>Name</label><input id="e_name" style="margin-bottom:12px">
  <label>Role</label>
  <select id="e_role" style="margin-bottom:12px"><option value="user">user</option><option value="admin">admin</option></select>
  <label>New password <span class="muted">(blank = keep)</span></label>
  <input id="e_pw" type="password" style="margin-bottom:12px">
  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn" id="e_save">Save</button>
    <button class="btn ghost" id="e_cancel">Cancel</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
function showMsg(el, text, kind) { el.textContent = text; el.className = 'msg ' + kind; el.style.display = 'block'; }
async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {method:'POST'});
  return {ok: r.ok, data: await r.json().catch(() => ({}))};
}

// gate: admin only
let me = null;
const m = await fetch('/api/me').then(r => r.json());
if (!m.user || m.user.role !== 'admin') { location.href = '/login.html'; }
$('whoami').textContent = m.user.email;
me = m.user;

async function loadUsers() {
  const {ok, data} = await api('/api/users');
  if (!ok) { showMsg($('userMsg'), data.error || 'Load failed', 'error'); return; }
  const tb = $('userRows');
  tb.innerHTML = '';
  for (const u of data.users) {
    const tr = document.createElement('tr');
    const created = new Date(u.created_at * 1000).toLocaleDateString();
    tr.innerHTML = `<td>${u.email}</td><td>${u.name}</td>
      <td><span class="pill ${u.role}">${u.role}</span></td>
      <td><span class="pill ${u.verified ? 'yes' : 'no'}">${u.verified ? 'verified' : 'pending'}</span></td>
      <td>${created}</td>
      <td><div class="row-actions" style="justify-content:flex-end">
        <button class="btn small ghost" data-act="edit" data-id="${u.id}">Edit</button>
        <button class="btn small danger" data-act="del" data-id="${u.id}" data-email="${u.email}">Delete</button>
      </div></td>`;
    tb.appendChild(tr);
  }
  tb.querySelectorAll('button').forEach(b => b.onclick = async () => {
    const act = b.dataset.act;
    if (act === 'edit') {
      const u = data.users.find(x => x.id == b.dataset.id);
      $('e_id').value = u.id; $('e_email').value = u.email; $('e_name').value = u.name;
      $('e_role').value = u.role; $('e_pw').value = '';
      $('editDlg').showModal();
    } else {
      if (!confirm(`Delete ${b.dataset.email}? This can't be undone.`)) return;
      const {ok, data: d} = await api('/api/users/delete', {id: +b.dataset.id});
      showMsg($('userMsg'), ok ? 'User deleted' : (d.error || 'Delete failed'), ok ? 'ok' : 'error');
      if (ok) loadUsers();
    }
  });
}
$('e_cancel').onclick = () => $('editDlg').close();
$('e_save').onclick = async () => {
  const body = {id: +$('e_id').value, name: $('e_name').value.trim(), role: $('e_role').value};
  if ($('e_pw').value) body.password = $('e_pw').value;
  const {ok, data} = await api('/api/users/update', body);
  $('editDlg').close();
  showMsg($('userMsg'), ok ? 'User updated' : (data.error || 'Update failed'), ok ? 'ok' : 'error');
  if (ok) loadUsers();
};

async function loadSettings() {
  const {ok, data} = await api('/api/admin/settings');
  if (ok && data.settings) {
    const s = data.settings;
    $('s_host').value = s.smtp_host || ''; $('s_port').value = s.smtp_port || '';
    $('s_tls').value = s.smtp_tls || 'starttls'; $('s_user').value = s.smtp_user || '';
    $('s_from').value = s.from_address || '';
    if (s.smtp_password) $('s_pw').placeholder = 'configured (********) — leave blank to keep';
  }
}
$('saveSmtp').onclick = async () => {
  const p = {
    smtp_host: $('s_host').value.trim(),
    smtp_port: $('s_port').value.trim(),
    smtp_tls: $('s_tls').value,
    smtp_user: $('s_user').value.trim(),
    from_address: $('s_from').value.trim(),
  };
  if ($('s_pw').value) p.smtp_password = $('s_pw').value;
  const {ok, data} = await api('/api/admin/settings', p);
  showMsg($('smtpMsg'), ok ? 'Saved ✓' : (data.error || 'Save failed'), ok ? 'ok' : 'error');
  if (ok) { $('s_pw').value = ''; loadSettings(); }
};
$('testSmtp').onclick = async () => {
  const {ok, data} = await api('/api/admin/settings', {send_test: true, test_to: $('test_to').value.trim()});
  showMsg($('smtpMsg'), ok ? 'Test email sent — check the inbox' : (data.error || 'Test failed'), ok ? 'ok' : 'error');
};

loadUsers();
loadSettings();
</script>
</body>
</html>
