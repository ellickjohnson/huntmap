<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HuntMap — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script>
(function(){
  const THEMES = {
    'midnight-blaze':{ mode:'dark',  bg:'#0c1117', panel:'#151c26', panel2:'#1e2733', line:'#2c3a49', txt:'#edf1f6', dim:'#93a6b8', accent:'#ff6b35', accent2:'#3edbc7' },
    'pine-shadow':   { mode:'dark',  bg:'#0b1410', panel:'#142118', panel2:'#1d2f24', line:'#2f463a', txt:'#e8f1ea', dim:'#8fa998', accent:'#ff8a4a', accent2:'#57c79a' },
    'sagebrush':     { mode:'dark',  bg:'#12140f', panel:'#1c2018', panel2:'#273023', line:'#3c4736', txt:'#ecefe3', dim:'#9aa58c', accent:'#ffb35c', accent2:'#9cc779' },
    'river-bottom':  { mode:'dark',  bg:'#0c1218', panel:'#151f2a', panel2:'#1f2d3d', line:'#314659', txt:'#e6eef6', dim:'#8ba4b8', accent:'#f0a860', accent2:'#59c2c8' },
    'timber':        { mode:'dark',  bg:'#141110', panel:'#211b17', panel2:'#2e2721', line:'#463d31', txt:'#f0eae1', dim:'#a99c89', accent:'#e06f2f', accent2:'#8fba72' },
    'basalt':        { mode:'dark',  bg:'#0f1215', panel:'#181d22', panel2:'#232a31', line:'#373f47', txt:'#e7ebef', dim:'#95a2ad', accent:'#c98a52', accent2:'#7aa6c9' },
    'first-light':   { mode:'dark',  bg:'#131019', panel:'#1d1827', panel2:'#272133', line:'#3d3550', txt:'#ece8f4', dim:'#a29ab6', accent:'#ff7a5c', accent2:'#b48ef5' },
    'morning-camp':  { mode:'light', bg:'#f3efe7', panel:'#fbf9f4', panel2:'#ebe5d8', line:'#d7cfbd', txt:'#2a2925', dim:'#78735f', accent:'#c25a1e', accent2:'#3f7d64' },
    'aspen-grove':   { mode:'light', bg:'#f1f3ed', panel:'#fafcf6', panel2:'#e5ebdb', line:'#cfd7c4', txt:'#252d23', dim:'#6d7963', accent:'#6ea055', accent2:'#a4571f' },
    'high-plains':   { mode:'light', bg:'#f4f1ea', panel:'#fcf9f3', panel2:'#ebe3d4', line:'#d8cfba', txt:'#322d25', dim:'#817763', accent:'#a86a38', accent2:'#4d7f95' },
    'snowline':      { mode:'light', bg:'#f1f3f6', panel:'#fafbfd', panel2:'#e4e8ee', line:'#ccd3dc', txt:'#232a31', dim:'#6c7883', accent:'#d05a2e', accent2:'#3f739c' },
    'paper-map':     { mode:'light', bg:'#faf7f0', panel:'#fffdf8', panel2:'#f0ebe0', line:'#dcd3c1', txt:'#332f27', dim:'#827a66', accent:'#b3541e', accent2:'#41689b' },
  };
  window.HM_THEMES = THEMES;
  const t = THEMES[localStorage.getItem('hm-theme') || 'midnight-blaze'] || THEMES['midnight-blaze'];
  const r = document.documentElement.style;
  for (const [k, v] of Object.entries(t)) if (k !== 'mode') r.setProperty('--' + k, v);
  document.documentElement.style.setProperty('--panel2', t.panel2);
  document.documentElement.dataset.themeMode = t.mode;
  document.documentElement.style.setProperty('color-scheme', t.mode === 'light' ? 'light' : 'dark');
})();
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--txt); margin:0; padding:24px; }
  header { display:flex; align-items:center; justify-content:space-between; max-width:960px; margin:0 auto 24px; }
  h1 { font-size:22px; margin:0; }
  .badge { background:var(--accent2); color:#fff; padding:4px 10px; border-radius:6px; font-size:12px; }
  a.back { color:var(--accent2); text-decoration:none; font-size:14px; }
  .wrap { max-width:960px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
  .card h2 { margin:0 0 14px; font-size:17px; color:var(--txt); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  label { font-size:12px; color:var(--dim); display:block; margin-bottom:4px; }
  input,select {
    background:var(--bg); border:1px solid var(--line); color:var(--txt);
    padding:10px; border-radius:8px; font-size:14px; width:100%;
  }
  input:focus,select:focus { outline:2px solid var(--accent2); border-color:transparent; }
  .btn { background:var(--accent2); color:#fff; border:0; padding:10px 18px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:hover { background:var(--accent2); }
  .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  .btn.danger { background:#b91c1c; }
  .btn.small { padding:6px 12px; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em; padding:8px; border-bottom:1px solid var(--line); }
  td { padding:10px 8px; border-bottom:1px solid var(--panel); }
  .pill { padding:2px 10px; border-radius:99px; font-size:11px; font-weight:600; }
  .pill.admin { background:#7c2d12; color:#fdba74; }
  .pill.user { background:#164e63; color:#67e8f9; }
  .pill.yes { background:#14532d; color:#86efac; }
  .pill.no { background:#7f1d1d; color:#fca5a5; }
  .msg { padding:10px; border-radius:8px; font-size:13px; display:none; margin-top:12px; }
  .msg.error { background:#7f1d1d33; color:#fca5a5; }
  .msg.ok { background:#14532d33; color:#86efac; }
  .row-actions { display:flex; gap:6px; }
  dialog { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:12px; padding:24px; max-width:420px; width:90%; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  .muted { color:#64748b; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🦌 HuntMap Admin <span class="badge" id="whoami"></span></h1>
  <a class="back" href="/">← Back to map</a>
</header>

<div class="card">
  <h2>SMTP settings <span class="muted">(verification + system emails)</span></h2>
  <div class="grid">
    <div><label>SMTP host</label><input id="s_host" placeholder="mx.ellickjohnson.net"></div>
    <div><label>Port</label><input id="s_port" type="number" placeholder="587"></div>
    <div><label>TLS mode</label><select id="s_tls">
      <option value="starttls">STARTTLS</option><option value="ssl">SSL/TLS</option><option value="none">None</option>
    </select></div>
    <div><label>Username</label><input id="s_user" placeholder="signups@autonode.co"></div>
    <div><label>Password</label><input id="s_pw" type="password" placeholder="leave = keep current"></div>
    <div><label>From address</label><input id="s_from" placeholder="signups@autonode.co"></div>
  </div>
  <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
    <button class="btn" id="saveSmtp">Save settings</button>
    <button class="btn ghost" id="testSmtp">Send test email</button>
    <input id="test_to" placeholder="send test to…" style="max-width:240px">
  </div>
  <div class="msg" id="smtpMsg"></div>
</div>

<div class="card">
  <h2>AI stats assistant <span class="muted">(powers the "Ask AI" panel)</span></h2>
  <div class="grid">
    <div><label>Provider</label><select id="a_provider">
      <option value="">— choose —</option>
      <option value="openai">OpenAI</option><option value="groq">Groq (free tier)</option>
      <option value="freellmapi">freellmapi (local)</option><option value="ollama">Ollama (local)</option>
      <option value="custom">Custom base URL</option>
    </select></div>
    <div><label>Model</label><input id="a_model" placeholder="e.g. glm-5.3-flash / llama-3.3-70b / gpt-4o-mini"></div>
    <div style="grid-column:1/-1"><label>Base URL (auto from provider; override for custom)</label><input id="a_base" placeholder="https://api.groq.com/openai/v1"></div>
    <div style="grid-column:1/-1"><label>API key</label><input id="a_key" type="password" placeholder="leave blank = keep current"></div>
  </div>
  <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
    <button class="btn" id="saveAI">Save AI settings</button>
    <button class="btn ghost" id="testAI">Send test question</button>
  </div>
  <div class="msg" id="aiMsg"></div>
</div>

<div class="card">
  <h2>Users</h2>
  <table>
    <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Verified</th><th>Created</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody id="userRows"></tbody>
  </table>
  <div class="msg" id="userMsg"></div>
</div>

<dialog id="editDlg">
  <h2 style="margin:0 0 16px;font-size:17px">Edit user</h2>
  <input type="hidden" id="e_id">
  <label>Email</label><input id="e_email" disabled style="margin-bottom:12px">
  <label>Name</label><input id="e_name" style="margin-bottom:12px">
  <label>Role</label>
  <select id="e_role" style="margin-bottom:12px"><option value="user">user</option><option value="admin">admin</option></select>
  <label>New password <span class="muted">(blank = keep)</span></label>
  <input id="e_pw" type="password" style="margin-bottom:12px">
  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn" id="e_save">Save</button>
    <button class="btn ghost" id="e_cancel">Cancel</button>
  </div>
</dialog>

<script type="module">
const $ = id => document.getElementById(id);
function showMsg(el, text, kind) { el.textContent = text; el.className = 'msg ' + kind; el.style.display = 'block'; }
async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {method:'POST'});
  return {ok: r.ok, data: await r.json().catch(() => ({}))};
}

// gate: admin only
let me = null;
const m = await fetch('/api/me').then(r => r.json());
if (!m.user || m.user.role !== 'admin') { location.href = '/login.html'; }
$('whoami').textContent = m.user.email;
me = m.user;

async function loadUsers() {
  const {ok, data} = await api('/api/users');
  if (!ok) { showMsg($('userMsg'), data.error || 'Load failed', 'error'); return; }
  const tb = $('userRows');
  tb.innerHTML = '';
  for (const u of data.users) {
    const tr = document.createElement('tr');
    const created = new Date(u.created_at * 1000).toLocaleDateString();
    tr.innerHTML = `<td>${u.email}</td><td>${u.name}</td>
      <td><span class="pill ${u.role}">${u.role}</span></td>
      <td><span class="pill ${u.verified ? 'yes' : 'no'}">${u.verified ? 'verified' : 'pending'}</span></td>
      <td>${created}</td>
      <td><div class="row-actions" style="justify-content:flex-end">
        <button class="btn small ghost" data-act="edit" data-id="${u.id}">Edit</button>
        <button class="btn small danger" data-act="del" data-id="${u.id}" data-email="${u.email}">Delete</button>
      </div></td>`;
    tb.appendChild(tr);
  }
  tb.querySelectorAll('button').forEach(b => b.onclick = async () => {
    const act = b.dataset.act;
    if (act === 'edit') {
      const u = data.users.find(x => x.id == b.dataset.id);
      $('e_id').value = u.id; $('e_email').value = u.email; $('e_name').value = u.name;
      $('e_role').value = u.role; $('e_pw').value = '';
      $('editDlg').showModal();
    } else {
      if (!confirm(`Delete ${b.dataset.email}? This can't be undone.`)) return;
      const {ok, data: d} = await api('/api/users/delete', {id: +b.dataset.id});
      showMsg($('userMsg'), ok ? 'User deleted' : (d.error || 'Delete failed'), ok ? 'ok' : 'error');
      if (ok) loadUsers();
    }
  });
}
$('e_cancel').onclick = () => $('editDlg').close();
$('e_save').onclick = async () => {
  const body = {id: +$('e_id').value, name: $('e_name').value.trim(), role: $('e_role').value};
  if ($('e_pw').value) body.password = $('e_pw').value;
  const {ok, data} = await api('/api/users/update', body);
  $('editDlg').close();
  showMsg($('userMsg'), ok ? 'User updated' : (data.error || 'Update failed'), ok ? 'ok' : 'error');
  if (ok) loadUsers();
};

async function loadSettings() {
  const {ok, data} = await api('/api/admin/settings');
  if (ok && data.settings) {
    const s = data.settings;
    $('s_host').value = s.smtp_host || ''; $('s_port').value = s.smtp_port || '';
    $('s_tls').value = s.smtp_tls || 'starttls'; $('s_user').value = s.smtp_user || '';
    $('s_from').value = s.from_address || '';
    $('a_provider').value = s.ai_provider || ''; $('a_model').value = s.ai_model || '';
    $('a_base').value = s.ai_base_url || ''; $('a_key').placeholder = s.ai_api_key ? 'configured (*****' : 'leave blank to keep';
    if (s.ai_api_key) $('a_key').placeholder = 'configured (*******)';
    if (s.smtp_password) $('s_pw').placeholder = 'configured (********) — leave blank to keep';
  }
}
$('saveSmtp').onclick = async () => {
  const p = {
    smtp_host: $('s_host').value.trim(),
    smtp_port: $('s_port').value.trim(),
    smtp_tls: $('s_tls').value,
    smtp_user: $('s_user').value.trim(),
    from_address: $('s_from').value.trim(),
  };
  if ($('s_pw').value) p.smtp_password = $('s_pw').value;
  const {ok, data} = await api('/api/admin/settings', p);
  showMsg($('smtpMsg'), ok ? 'Saved ✓' : (data.error || 'Save failed'), ok ? 'ok' : 'error');
  if (ok) { $('s_pw').value = ''; loadSettings(); }
};
$('saveAI').onclick = async () => {
  const p = { ai_provider: $('a_provider').value, ai_model: $('a_model').value.trim(), ai_base_url: $('a_base').value.trim() };
  if ($('a_key').value) p.ai_api_key = $('a_key').value;
  const {ok, data} = await api('/api/admin/settings', p);
  showMsg($('aiMsg'), ok ? 'Saved ✓' : (data.error || 'Save failed'), ok ? 'ok' : 'error');
  if (ok) { $('a_key').value = ''; loadSettings(); }
};
$('testAI').onclick = async () => {
  const {ok, data} = await api('/api/ai/chat', {message: 'Which unit has the highest success rate?'});
  showMsg($('aiMsg'), ok ? ('AI replied: ' + (data.reply || '').slice(0, 120) + '…') : (data.error || 'Test failed. Is the app open?'), ok ? 'ok' : 'error');
};
$('testSmtp').onclick = async () => {
  const {ok, data} = await api('/api/admin/settings', {send_test: true, test_to: $('test_to').value.trim()});
  showMsg($('smtpMsg'), ok ? 'Test email sent — check the inbox' : (data.error || 'Test failed'), ok ? 'ok' : 'error');
};

loadUsers();
loadSettings();
</script>
</body>
</html>
