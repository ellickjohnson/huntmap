<!DOCTYPE html>
<html lang="en" data-theme-mode="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>HuntMap — Admin</title>
<meta name="theme-color" content="#0B0F0D"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0F0D'/%3E%3Cpath d='M5 26 16 6l11 20z' fill='none' stroke='%23FF6B1A' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<link href="/css/huntmap.css" rel="stylesheet"/>
<script src="/js/hm-icons-boot.js"></script>
<script src="/js/hm-theme.js"></script>
<style>
  body{ margin:0; background:var(--bg); color:var(--txt); font-family:var(--f-ui); font-size:13.5px; }
  a{ color:var(--txt2); text-decoration:none; }
  a:hover{ color:var(--accent); }

  /* ---------- top bar ---------- */
  .top{
    position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:16px;
    height:54px; padding:0 22px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  .wordmark{ font-family:var(--f-disp); font-size:19px; line-height:1; }
  .wordmark b{ color:var(--accent); font-weight:400; }
  .top .slash{ color:var(--txt3); font-family:var(--f-mono); font-size:11px; }
  .top .sect{
    font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--txt3);
  }
  .top .spacer{ flex:1; }
  .whoami{
    font-family:var(--f-mono); font-size:10px; color:var(--txt2);
    border:1px solid var(--line); border-radius:var(--r-pill); padding:4px 10px;
  }
  .back{
    display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px;
    border:1px solid var(--line2); border-radius:var(--r-sm); color:var(--txt);
    font-size:12px; font-weight:500;
    transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .back:hover{ background:var(--panel2); border-color:var(--txt3); color:var(--txt); }
  .back svg{ width:14px; height:14px; }

  /* ---------- layout ---------- */
  .wrap{ max-width:1020px; margin:0 auto; padding:26px 22px 70px; display:flex; flex-direction:column; gap:18px; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; padding-bottom:4px; }
  .page-head h1{ font-size:24px; letter-spacing:-.02em; font-weight:600; }
  .page-head p{ margin:5px 0 0; color:var(--txt3); font-size:12.5px; }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md);
    padding:0; overflow:hidden;
  }
  .card-head{
    display:flex; align-items:baseline; gap:10px; padding:13px 16px 11px;
    border-bottom:1px solid var(--line); background:var(--bg2);
  }
  .card-head .idx{
    font-family:var(--f-mono); font-size:9.5px; letter-spacing:.12em; color:var(--accent);
  }
  .card-head h2{
    font-size:13.5px; font-weight:600; letter-spacing:-.005em; margin:0;
  }
  .card-head .muted{ margin-left:auto; }
  .card-body{ padding:16px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:13px; }
  .fld{ display:flex; flex-direction:column; gap:5px; }
  .fld.wide{ grid-column:1/-1; }
  .fld label{
    font-family:var(--f-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--txt3);
  }
  .fld input,.fld select{ width:100%; font-size:13px; }
  .actions{ display:flex; gap:8px; margin-top:15px; flex-wrap:wrap; align-items:center; }
  .actions input{ max-width:240px; }

  .msg{
    display:none; margin-top:12px; font-size:12px; padding:8px 11px;
    border-radius:var(--r-sm); border:1px solid transparent;
  }
  .msg.error{ display:block; color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, transparent); background:color-mix(in srgb, var(--danger) 9%, transparent); }
  .msg.ok{ display:block; color:var(--ok); border-color:color-mix(in srgb, var(--ok) 40%, transparent); background:color-mix(in srgb, var(--ok) 9%, transparent); }

  /* ---------- table ---------- */
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{
    text-align:left; font-family:var(--f-mono); font-size:8.5px; letter-spacing:.13em; text-transform:uppercase;
    color:var(--txt3); font-weight:500; padding:9px 10px; border-bottom:1px solid var(--line);
    background:var(--bg2); position:sticky; top:54px;
  }
  tbody td{ padding:10px; border-bottom:1px solid color-mix(in srgb, var(--line) 55%, transparent); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:0; }
  tbody tr:hover td{ background:color-mix(in srgb, var(--txt) 3%, transparent); }
  td:nth-child(5){ font-family:var(--f-mono); font-size:11.5px; color:var(--txt2); font-variant-numeric:tabular-nums; }

  .pill{
    display:inline-block; padding:2px 8px; border-radius:var(--r-pill);
    font-family:var(--f-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
    border:1px solid transparent;
  }
  .pill.admin{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, transparent); background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .pill.user{ color:var(--txt2); border-color:var(--line2); background:var(--bg2); }
  .pill.yes{ color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, transparent); background:color-mix(in srgb, var(--ok) 9%, transparent); }
  .pill.no{ color:var(--warn); border-color:color-mix(in srgb, var(--warn) 45%, transparent); background:color-mix(in srgb, var(--warn) 9%, transparent); }

  .row-actions{ display:flex; gap:5px; justify-content:flex-end; }
  .btn.small{ height:26px; padding:0 9px; font-size:11.5px; }
  .btn.danger{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, transparent); background:transparent; }
  .btn.danger:hover{ background:color-mix(in srgb, var(--danger) 12%, transparent); border-color:var(--danger); }
  .muted{ color:var(--txt3); font-size:11px; font-family:var(--f-mono); letter-spacing:.04em; }

  /* ---------- dialog ---------- */
  dialog{
    background:var(--panel); color:var(--txt); border:1px solid var(--line2);
    border-radius:var(--r-md); padding:0; max-width:430px; width:92%;
    box-shadow:var(--shadow-pop);
  }
  dialog::backdrop{ background:rgba(0,0,0,.62); }
  dialog .dlg-head{
    padding:13px 16px; border-bottom:1px solid var(--line);
    font-family:var(--f-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--txt2);
  }
  dialog .dlg-body{ padding:16px; display:flex; flex-direction:column; gap:11px; }
  dialog .dlg-foot{ padding:0 16px 16px; display:flex; gap:8px; }
  dialog h2{ display:none; }

  @media (max-width: 720px){
    .wrap{ padding:16px 13px 60px; }
    .whoami{ display:none; }
    .page-head h1{ font-size:20px; }
    thead th{ top:54px; }
    tbody td, thead th{ padding:8px 7px; }
    td:nth-child(2), th:nth-child(2){ display:none; }
  }
</style>
</head>
<body>

<div class="top">
  <span class="wordmark">Elk<b>Hunt</b>Map</span>
  <span class="slash">/</span>
  <span class="sect">Admin</span>
  <span class="spacer"></span>
  <span class="whoami" id="whoami"></span>
  <a class="back" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevronLeft"/></svg>
    Back to map
  </a>
</div>

<div class="wrap">
  <div class="page-head">
    <div>
      <h1>Admin console</h1>
      <p>Mail transport, AI assistant credentials and account access.</p>
    </div>
  </div>

  <section class="card">
    <div class="card-head">
      <span class="idx">01</span>
      <h2>SMTP</h2>
      <span class="muted">verification &amp; system email</span>
    </div>
    <div class="card-body">
      <div class="grid">
        <div class="fld"><label for="s_host">Host</label><input id="s_host" placeholder="mx.ellickjohnson.net"></div>
        <div class="fld"><label for="s_port">Port</label><input id="s_port" type="number" placeholder="587"></div>
        <div class="fld"><label for="s_tls">TLS mode</label><select id="s_tls">
          <option value="starttls">STARTTLS</option><option value="ssl">SSL/TLS</option><option value="none">None</option>
        </select></div>
        <div class="fld"><label for="s_user">Username</label><input id="s_user" placeholder="signups@autonode.co"></div>
        <div class="fld"><label for="s_pw">Password</label><input id="s_pw" type="password" placeholder="leave blank = keep current"></div>
        <div class="fld"><label for="s_from">From address</label><input id="s_from" placeholder="signups@autonode.co"></div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="saveSmtp">Save settings</button>
        <button class="btn" id="testSmtp">Send test email</button>
        <input id="test_to" placeholder="send test to…">
      </div>
      <div class="msg" id="smtpMsg"></div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="idx">02</span>
      <h2>AI assistant</h2>
      <span class="muted">powers the "Ask" panel</span>
    </div>
    <div class="card-body">
      <div class="grid">
        <div class="fld"><label for="a_provider">Provider</label><select id="a_provider">
          <option value="">— choose —</option>
          <option value="openai">OpenAI</option><option value="groq">Groq (free tier)</option>
          <option value="freellmapi">freellmapi (local)</option><option value="ollama">Ollama (local)</option>
          <option value="custom">Custom base URL</option>
        </select></div>
        <div class="fld"><label for="a_model">Model</label><input id="a_model" placeholder="e.g. glm-5.3-flash / llama-3.3-70b"></div>
        <div class="fld wide"><label for="a_base">Base URL · auto from provider, override for custom</label><input id="a_base" placeholder="https://api.groq.com/openai/v1"></div>
        <div class="fld wide"><label for="a_key">API key</label><input id="a_key" type="password" placeholder="leave blank = keep current"></div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="saveAI">Save AI settings</button>
        <button class="btn" id="testAI">Send test question</button>
      </div>
      <div class="msg" id="aiMsg"></div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="idx">03</span>
      <h2>Users</h2>
      <span class="muted" id="userCount"></span>
    </div>
    <table>
      <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Status</th><th>Created</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody id="userRows"></tbody>
    </table>
    <div class="card-body" style="padding-top:0"><div class="msg" id="userMsg"></div></div>
  </section>
</div>

<dialog id="editDlg">
  <div class="dlg-head">Edit user</div>
  <h2>Edit user</h2>
  <div class="dlg-body">
    <input type="hidden" id="e_id">
    <div class="fld"><label for="e_email">Email</label><input id="e_email" disabled></div>
    <div class="fld"><label for="e_name">Name</label><input id="e_name"></div>
    <div class="fld"><label for="e_role">Role</label>
      <select id="e_role"><option value="user">user</option><option value="admin">admin</option></select></div>
    <div class="fld"><label for="e_pw">New password · blank = keep</label><input id="e_pw" type="password"></div>
  </div>
  <div class="dlg-foot">
    <button class="btn btn-primary" id="e_save">Save</button>
    <button class="btn btn-ghost" id="e_cancel">Cancel</button>
  </div>
</dialog>

<script type="module">
const $ = id => document.getElementById(id);
function showMsg(el, text, kind) { el.textContent = text; el.className = 'msg ' + kind; el.style.display = 'block'; }
async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {method:'POST'});
  return {ok: r.ok, data: await r.json().catch(() => ({}))};
}

// gate: admin only
let me = null;
const m = await fetch('/api/me').then(r => r.json());
if (!m.user || m.user.role !== 'admin') { location.href = '/login.html'; }
$('whoami').textContent = m.user.email;
me = m.user;

async function loadUsers() {
  const {ok, data} = await api('/api/users');
  if (!ok) { showMsg($('userMsg'), data.error || 'Load failed', 'error'); return; }
  const tb = $('userRows');
  tb.innerHTML = '';
  const cnt = $('userCount');
  if (cnt) cnt.textContent = data.users.length + ' account' + (data.users.length === 1 ? '' : 's');
  for (const u of data.users) {
    const tr = document.createElement('tr');
    const created = new Date(u.created_at * 1000).toLocaleDateString();
    tr.innerHTML = `<td>${u.email}</td><td>${u.name}</td>
      <td><span class="pill ${u.role}">${u.role}</span></td>
      <td><span class="pill ${u.verified ? 'yes' : 'no'}">${u.verified ? 'verified' : 'pending'}</span></td>
      <td>${created}</td>
      <td><div class="row-actions">
        <button class="btn small" data-act="edit" data-id="${u.id}">Edit</button>
        <button class="btn small danger" data-act="del" data-id="${u.id}" data-email="${u.email}">Delete</button>
      </div></td>`;
    tb.appendChild(tr);
  }
  tb.querySelectorAll('button').forEach(b => b.onclick = async () => {
    const act = b.dataset.act;
    if (act === 'edit') {
      const u = data.users.find(x => x.id == b.dataset.id);
      $('e_id').value = u.id; $('e_email').value = u.email; $('e_name').value = u.name;
      $('e_role').value = u.role; $('e_pw').value = '';
      $('editDlg').showModal();
    } else {
      if (!confirm(`Delete ${b.dataset.email}? This can't be undone.`)) return;
      const {ok, data: d} = await api('/api/users/delete', {id: +b.dataset.id});
      showMsg($('userMsg'), ok ? 'User deleted' : (d.error || 'Delete failed'), ok ? 'ok' : 'error');
      if (ok) loadUsers();
    }
  });
}
$('e_cancel').onclick = () => $('editDlg').close();
$('e_save').onclick = async () => {
  const body = {id: +$('e_id').value, name: $('e_name').value.trim(), role: $('e_role').value};
  if ($('e_pw').value) body.password = $('e_pw').value;
  const {ok, data} = await api('/api/users/update', body);
  $('editDlg').close();
  showMsg($('userMsg'), ok ? 'User updated' : (data.error || 'Update failed'), ok ? 'ok' : 'error');
  if (ok) loadUsers();
};

async function loadSettings() {
  const {ok, data} = await api('/api/admin/settings');
  if (ok && data.settings) {
    const s = data.settings;
    $('s_host').value = s.smtp_host || ''; $('s_port').value = s.smtp_port || '';
    $('s_tls').value = s.smtp_tls || 'starttls'; $('s_user').value = s.smtp_user || '';
    $('s_from').value = s.from_address || '';
    $('a_provider').value = s.ai_provider || ''; $('a_model').value = s.ai_model || '';
    $('a_base').value = s.ai_base_url || ''; $('a_key').placeholder = s.ai_api_key ? 'configured (*****' : 'leave blank to keep';
    if (s.ai_api_key) $('a_key').placeholder = 'configured (*******)';
    if (s.smtp_password) $('s_pw').placeholder = 'configured (********) — leave blank to keep';
  }
}
$('saveSmtp').onclick = async () => {
  const p = {
    smtp_host: $('s_host').value.trim(),
    smtp_port: $('s_port').value.trim(),
    smtp_tls: $('s_tls').value,
    smtp_user: $('s_user').value.trim(),
    from_address: $('s_from').value.trim(),
  };
  if ($('s_pw').value) p.smtp_password = $('s_pw').value;
  const {ok, data} = await api('/api/admin/settings', p);
  showMsg($('smtpMsg'), ok ? 'Saved ✓' : (data.error || 'Save failed'), ok ? 'ok' : 'error');
  if (ok) { $('s_pw').value = ''; loadSettings(); }
};
$('saveAI').onclick = async () => {
  const p = { ai_provider: $('a_provider').value, ai_model: $('a_model').value.trim(), ai_base_url: $('a_base').value.trim() };
  if ($('a_key').value) p.ai_api_key = $('a_key').value;
  const {ok, data} = await api('/api/admin/settings', p);
  showMsg($('aiMsg'), ok ? 'Saved ✓' : (data.error || 'Save failed'), ok ? 'ok' : 'error');
  if (ok) { $('a_key').value = ''; loadSettings(); }
};
$('testAI').onclick = async () => {
  const {ok, data} = await api('/api/ai/chat', {message: 'Which unit has the highest success rate?'});
  showMsg($('aiMsg'), ok ? ('AI replied: ' + (data.reply || '').slice(0, 120) + '…') : (data.error || 'Test failed. Is the app open?'), ok ? 'ok' : 'error');
};
$('testSmtp').onclick = async () => {
  const {ok, data} = await api('/api/admin/settings', {send_test: true, test_to: $('test_to').value.trim()});
  showMsg($('smtpMsg'), ok ? 'Test email sent — check the inbox' : (data.error || 'Test failed'), ok ? 'ok' : 'error');
};

loadUsers();
loadSettings();
</script>
</body>
</html>
