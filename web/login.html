<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HuntMap — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" rel="stylesheet"/>
<script>
(function(){
  const THEMES = {
    'midnight-blaze':{ mode:'dark',  bg:'#0c1117', panel:'#151c26', panel2:'#1e2733', line:'#2c3a49', txt:'#edf1f6', dim:'#93a6b8', accent:'#ff6b35', accent2:'#3edbc7' },
    'pine-shadow':   { mode:'dark',  bg:'#0b1410', panel:'#142118', panel2:'#1d2f24', line:'#2f463a', txt:'#e8f1ea', dim:'#8fa998', accent:'#ff8a4a', accent2:'#57c79a' },
    'sagebrush':     { mode:'dark',  bg:'#12140f', panel:'#1c2018', panel2:'#273023', line:'#3c4736', txt:'#ecefe3', dim:'#9aa58c', accent:'#ffb35c', accent2:'#9cc779' },
    'river-bottom':  { mode:'dark',  bg:'#0c1218', panel:'#151f2a', panel2:'#1f2d3d', line:'#314659', txt:'#e6eef6', dim:'#8ba4b8', accent:'#f0a860', accent2:'#59c2c8' },
    'timber':        { mode:'dark',  bg:'#141110', panel:'#211b17', panel2:'#2e2721', line:'#463d31', txt:'#f0eae1', dim:'#a99c89', accent:'#e06f2f', accent2:'#8fba72' },
    'basalt':        { mode:'dark',  bg:'#0f1215', panel:'#181d22', panel2:'#232a31', line:'#373f47', txt:'#e7ebef', dim:'#95a2ad', accent:'#c98a52', accent2:'#7aa6c9' },
    'first-light':   { mode:'dark',  bg:'#131019', panel:'#1d1827', panel2:'#272133', line:'#3d3550', txt:'#ece8f4', dim:'#a29ab6', accent:'#ff7a5c', accent2:'#b48ef5' },
    'morning-camp':  { mode:'light', bg:'#f3efe7', panel:'#fbf9f4', panel2:'#ebe5d8', line:'#d7cfbd', txt:'#2a2925', dim:'#78735f', accent:'#c25a1e', accent2:'#3f7d64' },
    'aspen-grove':   { mode:'light', bg:'#f1f3ed', panel:'#fafcf6', panel2:'#e5ebdb', line:'#cfd7c4', txt:'#252d23', dim:'#6d7963', accent:'#6ea055', accent2:'#a4571f' },
    'high-plains':   { mode:'light', bg:'#f4f1ea', panel:'#fcf9f3', panel2:'#ebe3d4', line:'#d8cfba', txt:'#322d25', dim:'#817763', accent:'#a86a38', accent2:'#4d7f95' },
    'snowline':      { mode:'light', bg:'#f1f3f6', panel:'#fafbfd', panel2:'#e4e8ee', line:'#ccd3dc', txt:'#232a31', dim:'#6c7883', accent:'#d05a2e', accent2:'#3f739c' },
    'paper-map':     { mode:'light', bg:'#faf7f0', panel:'#fffdf8', panel2:'#f0ebe0', line:'#dcd3c1', txt:'#332f27', dim:'#827a66', accent:'#b3541e', accent2:'#41689b' },
  };
  window.HM_THEMES = THEMES;
  const t = THEMES[localStorage.getItem('hm-theme') || 'midnight-blaze'] || THEMES['midnight-blaze'];
  const r = document.documentElement.style;
  for (const [k, v] of Object.entries(t)) if (k !== 'mode') r.setProperty('--' + k, v);
  document.documentElement.style.setProperty('--panel2', t.panel2);
  document.documentElement.dataset.themeMode = t.mode;
  document.documentElement.style.setProperty('color-scheme', t.mode === 'light' ? 'light' : 'dark');
})();
</script>
<style>
  :root { color-scheme: dark; } /* overridden by theme script */
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(560px 420px at 12% -6%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 62%),
      radial-gradient(680px 480px at 96% 108%, color-mix(in srgb, var(--accent2) 13%, transparent), transparent 66%),
      linear-gradient(160deg, var(--bg) 0%, var(--panel) 60%, var(--bg) 100%);
    color: var(--txt); min-height: 100vh; margin: 0;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%);
    border: 1px solid var(--line); border-radius: 24px;
    padding: 36px 32px 30px; width: 100%; max-width: 410px;
    box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    animation: rise .5s cubic-bezier(.16,1,.3,1);
    position: relative; overflow: hidden;
  }
  .card::before { content:''; position:absolute; inset:-1px; border-radius:24px; padding:1px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 45%, transparent), transparent 35%, transparent 70%, color-mix(in srgb, var(--accent2) 35%, transparent));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none; }
  @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.985); } }
  .logo { text-align: center; margin-bottom: 26px; }
  .logo .icon { font-size: 46px; filter: drop-shadow(0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent)); }
  .logo h1 { margin: 10px 0 4px; font-size: 26px; font-weight: 800; letter-spacing: -0.4px; color: var(--txt); }
  .logo p { margin: 0; color: var(--dim); font-size: 14px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 22px; background: color-mix(in srgb, var(--bg) 70%, transparent); border-radius: 14px; padding: 4px; border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .tabs button {
    flex: 1; padding: 10px; border: 0; border-radius: 11px; background: transparent;
    color: var(--dim); font-size: 15px; font-weight: 500; cursor: pointer; transition: all .2s cubic-bezier(.16,1,.3,1);
  }
  .tabs button.active { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--txt); font-weight: 600; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
  form { display: none; flex-direction: column; gap: 12px; }
  form.active { display: flex; }
  input {
    background: color-mix(in srgb, var(--bg) 75%, transparent); border: 1px solid var(--line); color: var(--txt);
    padding: 12px 14px; border-radius: 12px; font-size: 15px; width: 100%;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { outline: none; border-color: color-mix(in srgb, var(--accent2) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent2) 18%, transparent); }
  label { font-size: 12.5px; font-weight: 500; color: var(--dim); margin-bottom: -6px; }
  .btn {
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, var(--accent2)));
    color: #fff; border: 0; padding: 13px; border-radius: 12px;
    font-size: 15.5px; font-weight: 600; cursor: pointer; margin-top: 8px;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 32%, transparent);
    transition: transform .15s cubic-bezier(.16,1,.3,1), box-shadow .2s, filter .2s;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 9px 24px color-mix(in srgb, var(--accent) 42%, transparent); }
  .btn:active { transform: translateY(0) scale(.985); }
  .btn:disabled { opacity: .6; cursor: wait; transform: none; }
  .msg { padding: 12px; border-radius: 12px; font-size: 14px; display: none; line-height: 1.4; animation: rise .3s cubic-bezier(.16,1,.3,1); }
  .msg.error { background: #7f1d1d33; color: #fca5a5; border: 1px solid #7f1d1d; }
  .msg.ok { background: #14532d33; color: #86efac; border: 1px solid #14532d; }
  .swap { text-align: center; font-size: 13px; color: var(--dim); margin-top: 16px; }
  .swap a { color: var(--accent2); cursor: pointer; text-decoration: none; }
  .fine { font-size: 12px; color: var(--dim); text-align: center; margin-top: 20px; }
  .fine a { color: var(--dim); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">🦌</div>
    <h1>HuntMap</h1>
    <p>Elk harvest intelligence for NW Colorado</p>
  </div>

  <div class="tabs">
    <button id="tabLogin" class="active" type="button">Sign in</button>
    <button id="tabSignup" type="button">Create account</button>
  </div>

  <div id="msg" class="msg"></div>

  <form id="loginForm" class="active">
    <label for="li_email">Email</label>
    <input id="li_email" type="email" autocomplete="email" required>
    <label for="li_pw">Password</label>
    <input id="li_pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="loginBtn">Sign in</button>
    <div style="text-align:center;margin-top:10px">
      <a id="forgotLink" style="color:var(--accent2);font-size:13px;cursor:pointer;text-decoration:none">Forgot password?</a>
    </div>
  </form>

  <form id="formForgot">
    <p style="color:var(--dim);font-size:13px;line-height:1.5;margin:0 0 12px">
      Enter your account email and we'll send you a reset link (valid 1 hour).</p>
    <label for="fg_email">Email</label>
    <input id="fg_email" type="email" autocomplete="email" required>
    <button class="btn" type="submit" id="forgotBtn">Email me a reset link</button>
    <div style="text-align:center;margin-top:10px">
      <a id="forgotBack" style="color:var(--accent2);font-size:13px;cursor:pointer;text-decoration:none">← Back to sign in</a>
    </div>
  </form>

  <form id="formSignup">
    <label for="su_name">Name</label>
    <input id="su_name" type="text" autocomplete="name" required>
    <label for="su_email">Email</label>
    <input id="su_email" type="email" autocomplete="email" required>
    <label for="su_pw">Password (8+ characters)</label>
    <input id="su_pw" type="password" autocomplete="new-password" minlength="8" required>
    <button class="btn" type="submit" id="signupBtn">Create account</button>
  </form>

  <div class="swap" id="swapHint">
    <span id="swapText">No account yet?</span> <a id="swapLink">Sign up</a>
  </div>
  <style>#formForgot{display:none}</style>

  <div class="fine">
    <a href="/">← Back to map</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const msgEl = $('msg');
function showMsg(text, kind) {
  msgEl.textContent = text;
  msgEl.className = 'msg ' + kind;
  msgEl.style.display = 'block';
}
function hideMsg() { msgEl.style.display = 'none'; }

function setTab(login) {
  $('tabLogin').classList.toggle('active', login);
  $('tabSignup').classList.toggle('active', !login);
  $('formSignup').classList.toggle('active', !login);
  $('li_email').closest('form').classList.toggle('active', login);
  $('swapText').textContent = login ? 'No account yet?' : 'Already have an account?';
  $('swapLink').textContent = login ? 'Sign up' : 'Sign in';
  hideMsg();
}
$('tabLogin').onclick = () => setTab(true);
$('tabSignup').onclick = () => setTab(false);
// cleaner swap wiring
$('swapHint').querySelector('a').onclick = () => {
  setTab($('tabLogin').classList.contains('active'));
};

// ---- forgot password flow ----
function showForgot(showIt) {
  $('formForgot').style.display = showIt ? 'block' : 'none';
  $('li_email').closest('form').style.display = showIt ? 'none' : ($('tabLogin').classList.contains('active') ? 'active' : 'none');
  $('formSignup').style.display = showIt ? 'none' : ($('tabSignup').classList.contains('active') ? 'active' : 'none');
  if (showIt) { $('fg_email').value = $('li_email').value || ''; $('fg_email').focus(); }
  $('swapHint').style.display = showIt ? 'none' : 'block';
  $('tabLogin').style.visibility = showIt ? 'hidden' : 'visible';
  $('tabSignup').style.visibility = showIt ? 'hidden' : 'visible';
  hideMsg();
}
$('forgotLink').onclick = () => showForgot(true);
$('forgotBack').onclick = () => showForgot(false);

$('formForgot').addEventListener('submit', async e => {
  e.preventDefault();
  hideMsg();
  const btn = $('forgotBtn'); btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await fetch('/api/forgot', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: $('fg_email').value.trim()})
    });
    const d = await r.json();
    if (!r.ok) { showMsg(d.error || 'Request failed', 'error'); return; }
    showMsg(d.message || 'If that email has an account, a reset link is on its way.', 'ok');
  } catch (err) {
    showMsg('Network error — try again', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Email me a reset link';
  }
});

$('formSignup').addEventListener('submit', async e => {
  e.preventDefault();
  hideMsg();
  const btn = $('signupBtn'); btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const r = await fetch('/api/signup', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: $('su_name').value.trim(), email: $('su_email').value.trim(), password: $('su_pw').value})
    });
    const d = await r.json();
    if (!r.ok) { showMsg(d.error || 'Signup failed', 'error'); return; }
    showMsg(d.message || 'Account created! Check your email to verify.', 'ok');
    $('formSignup').reset();
  } catch (err) {
    showMsg('Network error — try again', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Create account';
  }
});

document.querySelector('#li_email').closest('form').addEventListener('submit', async e => {
  e.preventDefault();
  hideMsg();
  const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: $('li_email').value.trim(), password: $('li_pw').value})
    });
    const d = await r.json();
    if (!r.ok) { showMsg(d.error || 'Login failed', 'error'); return; }
    sessionStorage.setItem('huntmap_user', JSON.stringify(d.user));
    location.href = '/';
  } catch (err) {
    showMsg('Network error — try again', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});

// if already signed in, bounce to map
fetch('/api/me').then(r => r.json()).then(d => { if (d.user) location.href = '/'; });
</script>
</body>
</html>
