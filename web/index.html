<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HuntMap — Colorado Elk Units</title>
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #0f1419; --panel: #1a222b; --panel2: #232d38; --line: #2e3a46;
    --txt: #e8edf2; --dim: #8fa0b0; --accent: #ff6b35; --accent2: #4ecdc4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--txt); overflow: hidden; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; top: 12px; left: 12px; z-index: 10; width: 340px;
    background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
  .panel.collapsed { width: auto; }
  .panel-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; }
  .panel.collapsed .panel-header { border-bottom: 0; }
  .panel-header h1 { font-size: 17px; font-weight: 700; flex: 1; }
  .panel-header h1 span { color: var(--accent); }
  .collapse-btn { background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; width: 30px; height: 30px; font-size: 14px; cursor: pointer; }
  .collapse-btn:hover { color: var(--txt); border-color: var(--accent2); }
  .panel-body { display: flex; flex-direction: column; overflow: hidden; }
  .panel.collapsed .panel-body { display: none; }
  .controls { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .seg { display: flex; background: var(--panel2); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; padding: 7px 0; border: 0; background: transparent; color: var(--dim);
    border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .seg button.active { background: var(--accent); color: #fff; }
  .field { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .field label { color: var(--dim); width: 86px; flex-shrink: 0; }
  .field input[type=range] { flex: 1; accent-color: var(--accent); }
  .field .val { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .toggles { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 10.5px; padding: 4px 9px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--dim); cursor: pointer; user-select: none; transition: all .15s; }
  .chip.on { border-color: var(--accent2); color: var(--accent2); background: rgba(78,205,196,.08); }
  .list-meta { padding: 8px 14px 0; font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; }
  .unit-list { overflow-y: auto; padding: 6px 8px 12px; max-height: 200px; }
  .unit-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .unit-row:hover, .unit-row.sel { background: var(--panel2); }
  .unit-row .gmu { font-weight: 700; font-size: 14px; width: 44px; }
  .unit-row .bar { flex: 1; height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .unit-row .bar i { display: block; height: 100%;
    background: linear-gradient(90deg, #0e7490, #22c55e, #facc15, #ef4444); }
  .unit-row .score { width: 36px; text-align: right; font-size: 13px; font-weight: 700; color: var(--accent2); }
  .detail { position: absolute; right: 12px; top: 12px; z-index: 10; width: 300px;
    background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    padding: 0; display: none; max-height: calc(100vh - 24px); overflow-y: auto; }
  .detail.show { display: block; }
  .detail-head { display: flex; align-items: flex-start; padding: 16px 16px 0; cursor: grab; }
  .detail-body { padding: 0 16px 16px; }
  .detail.min .detail-body { display: none; }
  .detail-head h2 { font-size: 20px; flex: 1; }
  .detail-head .db-btns { display: flex; gap: 5px; }
  .close-btn { background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 6px; width: 26px; height: 26px; font-size: 13px; cursor: pointer; }
  .close-btn:hover { color: var(--txt); border-color: var(--accent); }
  .county { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .stat:last-child { border-bottom: 0; }
  .stat .k { color: var(--dim); }
  .stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .bigscore { text-align: center; margin: 8px 0 14px; }
  .bigscore .n { font-size: 42px; font-weight: 800; line-height: 1; }
  .bigscore .l { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); }
  .hist { margin: 10px 0 4px; }
  .hist .hist-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); margin-bottom: 6px; }
  .hist .bars { display: flex; align-items: flex-end; gap: 6px; height: 46px; margin-bottom: 4px; }
  .hist .bars.hunters { height: 34px; opacity: .8; }
  .hist .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  .hist .bars .b i { display: block; width: 100%; border-radius: 3px 3px 0 0;
    background: linear-gradient(180deg, var(--accent2), #0e7490); opacity: .45; transition: opacity .15s; }
  .hist .bars.hunters .b i { background: linear-gradient(180deg, #b0894e, #6b5637); }
  .hist .bars .b.on i, .hist .bars .b:hover i { opacity: 1; }
  .hist .bars .b span { font-size: 9px; color: var(--dim); }
  .hist .legend2 { display: flex; gap: 14px; font-size: 9.5px; color: var(--dim); margin-bottom: 6px; }
  .hist .legend2 b { color: var(--accent2); font-weight: 600; }
  .hist .legend2 i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; vertical-align: middle; }
  .hot-note { font-size: 10px; color: var(--dim); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); line-height: 1.5; }
  #legend { position: absolute; bottom: 18px; left: 12px; z-index: 10;
    background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; font-size: 11px; color: var(--dim); }
  #legend .grad { height: 10px; width: 180px; border-radius: 5px; margin: 5px 0 3px;
    background: linear-gradient(90deg, #181c34, #0e7490, #22c55e, #facc15, #ef4444); }
  .maplibregl-ctrl-attrib { background: rgba(15,20,25,.7) !important; color: var(--dim) !important; }
  .maplibregl-ctrl-attrib a { color: var(--dim) !important; }
  @media (max-width: 720px) {
    .panel { width: calc(100vw - 24px); max-height: 48vh; }
    .detail { width: calc(100vw - 24px); top: auto; bottom: 12px; max-height: 42vh; }
    #legend { display: none; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="sidePanel">
  <div class="panel-header">
    <h1>Elk<span>HuntMap</span> 🦌</h1>
    <button class="collapse-btn" id="panelToggle" title="Collapse panel">◀</button>
  </div>
  <div class="panel-body">
    <div class="controls">
      <div class="seg" id="metricSeg">
        <button data-m="hunt_score" class="active">Overall</button>
        <button data-m="harvest_score">Success</button>
        <button data-m="habitat_score">Habitat</button>
        <button data-m="public_pct">Public Land</button>
      </div>
      <div class="field">
        <label>Basemap</label>
        <div class="seg" id="baseSeg" style="flex:1">
          <button data-b="streets" class="active">Streets</button>
          <button data-b="satellite">Satellite</button>
          <button data-b="topo">Topo</button>
          <button data-b="hybrid">Sat+Topo</button>
        </div>
      </div>
      <div class="field">
        <label>Search</label>
        <div style="flex:1;position:relative">
          <input id="searchBox" placeholder="Town, lake, peak…" autocomplete="off"
            style="width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:12px"/>
          <div id="searchResults" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:20;
            background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:220px;overflow-y:auto;margin-top:2px"></div>
        </div>
      </div>
      <div class="field">
        <label>Unit style</label>
        <div class="seg" id="fillSeg" style="flex:1">
          <button data-f="fill" class="active">Fill</button>
          <button data-f="outline">Outline</button>
        </div>
      </div>
      <div class="toggles">
        <span class="chip" id="terrainChip">⛰️ 3D Terrain</span>
        <span class="chip on" id="hotspotChip">🔥 Hotspots</span>
        <span class="chip on" id="unitsChip">📏 ft · miles</span>
      </div>
      <div class="field">
        <label>Min score</label>
        <input type="range" id="minScore" min="0" max="100" value="0"/>
        <span class="val" id="minScoreVal">0</span>
      </div>
      <div class="toggles" id="layerToggles">
        <span class="chip on" data-l="none">Habitat: none</span>
        <span class="chip" data-l="elk_summer_concentration">Summer conc.</span>
        <span class="chip" data-l="elk_resident_population">Resident pop.</span>
        <span class="chip" data-l="elk_winter_concentration">Winter conc.</span>
        <span class="chip" data-l="elk_migration_corridors">Migration</span>
      </div>
      <div class="field" id="habitatOpacityField" style="display:none">
        <label>Habitat opacity</label>
        <input type="range" id="habitatOpacity" min="0" max="80" value="30"/>
        <span class="val" id="habitatOpacityVal">30</span>
      </div>
      <div class="field">
        <label>Markers</label>
        <div style="flex:1">
          <div class="toggles" id="markerToggles" style="margin-bottom:6px">
            <span class="chip on" data-mk="camp">🏕️ Camp</span>
            <span class="chip on" data-mk="sighted">👁️ Saw elk</span>
            <span class="chip on" data-mk="harvested">🏹 Shot elk</span>
            <span class="chip on" data-mk="parked">🚗 Parked</span>
            <span class="chip on" data-mk="waypoint">📍 Waypoint</span>
            <span class="chip on" data-mk="glassing">🔭 Glassing</span>
            <span class="chip on" data-mk="water">💧 Water</span>
            <span class="chip on" data-mk="trailhead">🥾 Trailhead</span>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            <button id="addMarkerBtn" style="flex:1;padding:6px;border-radius:6px;border:1px solid #33507a;background:#1b3a5c;color:#dbe7ff;cursor:pointer;font-size:12px">➕ Add marker (click map)</button>
          </div>
          <div id="addMarkerBar" style="display:none;margin-top:6px;padding:8px;border:1px solid #33507a;border-radius:8px;background:#12213a">
            <div style="font-size:11px;color:#8fa3c8;margin-bottom:4px">Click the map to place, then:</div>
            <div class="toggles" id="markerKindPick" style="margin-bottom:6px">
              <span class="chip" data-k="camp">🏕️</span>
              <span class="chip" data-k="sighted">👁️</span>
              <span class="chip" data-k="harvested">🏹</span>
              <span class="chip" data-k="parked">🚗</span>
              <span class="chip on" data-k="waypoint">📍</span>
              <span class="chip" data-k="glassing">🔭</span>
              <span class="chip" data-k="water">💧</span>
              <span class="chip" data-k="trailhead">🥾</span>
            </div>
            <input id="markerName" placeholder="Name (optional)" style="width:100%;box-sizing:border-box;margin-bottom:6px;padding:5px;border-radius:6px;border:1px solid #33507a;background:#0d1b2e;color:#dbe7ff;font-size:12px"/>
            <div style="display:flex;gap:6px">
              <button id="markerSave" style="flex:1;padding:6px;border-radius:6px;border:none;background:#0f766e;color:#fff;cursor:pointer;font-size:12px">Save</button>
              <button id="markerCancel" style="flex:1;padding:6px;border-radius:6px;border:1px solid #33507a;background:transparent;color:#8fa3c8;cursor:pointer;font-size:12px">Cancel</button>
            </div>
          </div>
          <div id="markerList" style="margin-top:8px;max-height:160px;overflow-y:auto"></div>
        </div>
      </div>
    </div>
    <div class="list-meta" id="listMeta"></div>
    <div class="unit-list" id="unitList"></div>
  </div>
</div>
<div class="detail" id="detail">
  <div class="detail-head" id="detailDrag">
    <h2 id="dTitle"></h2>
    <div class="db-btns">
      <button class="close-btn" id="detailMin" title="Collapse">—</button>
      <button class="close-btn" id="detailClose" title="Close">✕</button>
    </div>
  </div>
  <div class="detail-body" id="detailBody">
    <div class="county" id="dCounty"></div>
    <div class="bigscore"><div class="n" id="dScore"></div><div class="l" id="dScoreLabel">HUNT SCORE</div></div>
    <div id="dStats"></div>
    <div class="hist" id="dHist"></div>
    <div class="hot-note" id="dHot"></div>
  </div>
</div>
<div id="legend">
  <div id="legendLabel">Hunt score</div>
  <div class="grad"></div>
  <div style="display:flex; justify-content:space-between"><span>low</span><span>high</span></div>
</div>

<script type="module">
const maplibregl = window.maplibregl;

// ---------------- basemaps ----------------
const STREETS_STYLE = 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json';
const SATELLITE_STYLE = {
  version: 8,
  sources: {
    esri: {
      type: 'raster',
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      tileSize: 256, maxzoom: 19,
      attribution: 'Esri, Maxar, Earthstar Geographics',
    },
  },
  layers: [{ id: 'esri-imagery', type: 'raster', source: 'esri' }],
};
const TOPO_STYLE = {
  version: 8,
  sources: {
    opentopo: {
      type: 'raster',
      tiles: ['https://a.tile.opentopomap.org/{z}/{x}/{y}.png',
              'https://b.tile.opentopomap.org/{z}/{x}/{y}.png',
              'https://c.tile.opentopomap.org/{z}/{x}/{y}.png'],
      tileSize: 256, minzoom: 9, maxzoom: 17,
      attribution: '© OpenTopoMap (CC-BY-SA), © OpenStreetMap',
    },
  },
  layers: [{ id: 'opentopo', type: 'raster', source: 'opentopo', minzoom: 0, maxzoom: 22 }],
};
const HYBRID_STYLE = {
  version: 8,
  sources: {
    esri: {
      type: 'raster',
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      tileSize: 256, maxzoom: 19,
      attribution: 'Esri, Maxar | Contours: AWS Terrain Tiles',
    },
    hillshade: {
      type: 'raster-dem',
      tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      tileSize: 256, maxzoom: 15, encoding: 'terrarium',
    },
  },
  layers: [
    { id: 'esri-imagery', type: 'raster', source: 'esri' },
    { id: 'hybrid-hillshade', type: 'hillshade', source: 'hillshade',
      paint: { 'hillshade-exaggeration': 0.35, 'hillshade-shadow-color': '#000000', 'hillshade-highlight-color': '#ffffff' } },
  ],
};
const BASEMAPS = { streets: STREETS_STYLE, satellite: SATELLITE_STYLE, topo: TOPO_STYLE, hybrid: HYBRID_STYLE };

// ---------------- state ----------------
let UNITS = null;
let HISTORY = null;
let metric = 'hunt_score';
let minScore = 0;
let terrainOn = false;
let hotspotsOn = true;
let fillMode = 'fill';
let habitatLayer = 'none';
let habitatOpacity = 0.30;
let selectedGmu = null;
let selectedYear = 2024;
let hotspotsCache = {};
let clickWired = false;

const map = new maplibregl.Map({
  container: 'map',
  style: STREETS_STYLE,
  center: [-105.9, 39.6], zoom: 7.2, pitch: 0, attributionControl: true,
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

// ---------------- color ramps ----------------
const FILL_STOPS = [
  [0, 'rgba(24,28,52,0.80)'], [30, 'rgba(14,116,144,0.80)'],
  [55, 'rgba(34,197,94,0.80)'], [75, 'rgba(250,204,21,0.80)'],
  [88, 'rgba(239,68,68,0.80)'], [100, 'rgba(190,18,60,0.80)'],
];
const RAMP = [[0,[24,28,52]],[0.30,[14,116,144]],[0.55,[34,197,94]],[0.75,[250,204,21]],[0.88,[239,68,68]],[1,[190,18,60]]];
function heatColor(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < RAMP.length - 1; i++) {
    const [t0, c0] = RAMP[i], [t1, c1] = RAMP[i + 1];
    if (t >= t0 && t <= t1) {
      const a = (t - t0) / (t1 - t0);
      return `rgb(${c0.map((v, k) => Math.round(v + (c1[k] - v) * a)).join(',')})`;
    }
  }
  return 'rgb(190,18,60)';
}

function metricProp() {
  if (metric === 'public_pct') return 'public_pct';
  if (metric === 'habitat_score') return 'habitat_score';
  if (metric === 'harvest_score' && selectedYear !== 2024) return 'success_' + selectedYear;
  if (metric === 'harvest_score') return 'harvest_score';
  return 'hunt_score';
}
function unitValue(p) {
  if (metric !== 'harvest_score' || selectedYear === 2024 || !HISTORY) return p[metric] || 0;
  const h = (HISTORY[p.gmuid] || {})[String(selectedYear)];
  return h ? h.success : 0;
}
function centroidOf(f) {
  const rings = f.geometry.type === 'Polygon' ? [f.geometry.coordinates[0]] : f.geometry.coordinates.map(p => p[0]);
  const xs = [], ys = [];
  rings.forEach(r => r.forEach(pt => { xs.push(pt[0]); ys.push(pt[1]); }));
  return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
}

// ---------------- maplibre layers (single rendering path, drapes on terrain) ----------------
function fillExpr() {
  const prop = metricProp();
  const expr = ['interpolate', ['linear'], ['to-number', ['coalesce', ['get', prop], 0]]];
  for (const [v, c] of FILL_STOPS) expr.push(v, c);
  return expr;
}

function ensureUnitLayers() {
  if (!UNITS || !map.isStyleLoaded()) return;
  if (!map.getSource('gmu-src')) {
    map.addSource('gmu-src', { type: 'geojson', data: UNITS, promoteId: 'gmuid' });
  }
  // fill layer: full color in fill mode; invisible in outline mode
  if (!map.getLayer('gmu-fill')) {
    map.addLayer({
      id: 'gmu-fill', type: 'fill', source: 'gmu-src',
      paint: {
        'fill-color': fillExpr(),
        'fill-opacity': ['case', ['boolean', ['feature-state', 'selected'], false], 0.0,
          fillMode === 'fill' ? 0.80 : 0.0],
      },
    });
  } else {
    map.setPaintProperty('gmu-fill', 'fill-color', fillExpr());
    map.setPaintProperty('gmu-fill', 'fill-opacity', [
      'case', ['boolean', ['feature-state', 'selected'], false], 0.0,
      fillMode === 'fill' ? 0.80 : 0.0]);
  }
  map.setFilter('gmu-fill', minScore > 0
    ? ['>=', ['to-number', ['coalesce', ['get', metricProp()], 0]], minScore] : null);

  // outline layer: in outline mode every unit gets a colored outline
  // (color follows the current metric ramp); in fill mode a neutral line on top of fills
  const OUTLINE_STOPS = FILL_STOPS.map(([v, c]) => {
    const m = c.match(/rgba?\((\d+),(\d+),(\d+)/);
    return [v, `rgb(${m[1]},${m[2]},${m[3]})`];
  });
  const outlineColorExpr = ['interpolate', ['linear'], ['to-number', ['coalesce', ['get', metricProp()], 0]]];
  for (const [v, c] of OUTLINE_STOPS) outlineColorExpr.push(v, c);
  const lineColor = ['case',
    ['boolean', ['feature-state', 'selected'], false], '#4ecdc4',
    fillMode === 'outline' ? outlineColorExpr : 'rgba(120,135,150,0.95)'];
  if (!map.getLayer('gmu-outline')) {
    map.addLayer({
      id: 'gmu-outline', type: 'line', source: 'gmu-src',
      paint: {
        'line-color': lineColor,
        'line-width': ['case', ['boolean', ['feature-state', 'selected'], false], 6, fillMode === 'outline' ? 2.2 : 1],
        'line-opacity': 0.95,
      },
    });
  } else {
    map.setPaintProperty('gmu-outline', 'line-color', lineColor);
    map.setPaintProperty('gmu-outline', 'line-width',
      ['case', ['boolean', ['feature-state', 'selected'], false], 6, fillMode === 'outline' ? 2.2 : 1]);
  }

  // selection state
  if (selectedGmu != null) {
    map.setFeatureState({ source: 'gmu-src', id: selectedGmu }, { selected: true });
  }

  // habitat overlay (source replaced on every switch so layer choice is instant)
  if (habitatLayer !== 'none') {
    if (!map.getSource('habitat-src')) {
      map.addSource('habitat-src', { type: 'geojson', data: `/data/${habitatLayer}.geojson` });
    } else {
      map.getSource('habitat-src').setData(`/data/${habitatLayer}.geojson`);
    }
    if (!map.getLayer('habitat-fill')) {
      map.addLayer({
        id: 'habitat-fill', type: 'fill', source: 'habitat-src',
        paint: { 'fill-color': '#4ecdc4', 'fill-opacity': habitatOpacity },
      });
    } else {
      map.setPaintProperty('habitat-fill', 'fill-opacity', habitatOpacity);
    }
  } else if (map.getLayer('habitat-fill')) {
    map.removeLayer('habitat-fill');
    map.removeSource('habitat-src');
  }

  updateHotspotLayer();
  renderUnitList();
}

function updateHotspotLayer() {
  if (!map.isStyleLoaded()) return;
  ['gmu-heat', 'gmu-dots'].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
  if (!hotspotsOn || !selectedGmu || !hotspotsCache[selectedGmu]) return;
  const fc = { type: 'FeatureCollection', features: hotspotsCache[selectedGmu] };
  if (!map.getSource('hotspot-src')) {
    map.addSource('hotspot-src', { type: 'geojson', data: fc });
  } else {
    map.getSource('hotspot-src').setData(fc);
  }
  // smooth blended heatmap (datahuntguide style: continuous soft blobs, no grid)
  map.addLayer({
    id: 'gmu-heat', type: 'heatmap', source: 'hotspot-src',
    paint: {
      'heatmap-weight': ['interpolate', ['linear'], ['to-number', ['get', 's']], 0, 0.1, 100, 1],
      'heatmap-intensity': ['interpolate', ['linear'], ['zoom'], 7, 0.6, 12, 1.8, 16, 2.6],
      'heatmap-radius': ['interpolate', ['exponential', 1.8], ['zoom'], 7, 10, 10, 26, 13, 55, 16, 90],
      'heatmap-opacity': 0.8,
      'heatmap-color': [
        'interpolate', ['linear'], ['heatmap-density'],
        0, 'rgba(0,0,0,0)',
        0.08, 'rgba(13,71,161,0.25)',
        0.25, 'rgba(14,116,144,0.55)',
        0.45, 'rgba(34,197,94,0.7)',
        0.65, 'rgba(250,204,21,0.85)',
        0.85, 'rgba(255,80,50,0.95)',
        1, 'rgba(180,15,15,1)',
      ],
    },
  });
  // individual cells ONLY at high zoom (fade in; grid visible when you're close)
  map.addLayer({
    id: 'gmu-dots', type: 'circle', source: 'hotspot-src',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 0, 15, 5, 17, 9],
      'circle-color': ['interpolate', ['linear'], ['to-number', ['get', 's']],
        0, '#0e7490', 50, '#facc15', 100, '#ff5032'],
      'circle-stroke-color': 'rgba(0,0,0,0.6)', 'circle-stroke-width': 1,
      'circle-opacity': ['interpolate', ['linear'], ['zoom'], 13.5, 0, 15, 0.9],
    },
  });
}

// click handler registered ONCE (maplibre delegation survives style switches)
function wireClicks() {
  if (clickWired) return;
  clickWired = true;
  map.on('click', 'gmu-fill', e => {
    if (!e.features || !e.features.length) return;
    const uid = e.features[0].properties.gmuid;
    if (selectedGmu === uid) deselectUnit(); else selectUnit(uid);
  });
  map.on('mouseenter', 'gmu-fill', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'gmu-fill', () => map.getCanvas().style.cursor = '');
}

// ---------------- terrain ----------------
const TERRAIN_DEM = {
  type: 'raster-dem',
  tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
  encoding: 'terrarium', tileSize: 256, maxzoom: 15,
};
function setTerrain(on) {
  try {
    if (on) {
      if (!map.getSource('terrain-dem')) map.addSource('terrain-dem', TERRAIN_DEM);
      map.setTerrain({ source: 'terrain-dem', exaggeration: 1.35 });
    } else {
      map.setTerrain(null);
    }
  } catch (err) { console.error('terrain:', err); }
}

// ---------------- selection & detail ----------------
function selectUnit(uid) {
  selectedGmu = uid;
  const u = UNITS.features.find(f => f.properties.gmuid === uid);
  if (!u) return;
  const p = u.properties;
  document.getElementById('dTitle').textContent = `GMU ${p.gmuid}`;
  document.getElementById('dCounty').textContent =
    `${p.county || ''} · herd ${p.elk_dau || '—'} · ${UNITS_FMT.area(+p.sq_miles || 0)}`;
  renderDetail(p);
  document.getElementById('detail').classList.add('show');
  ensureUnitLayers();
  loadHotspots(uid);
  const c = centroidOf(u);
  map.flyTo({ center: c, zoom: Math.max(map.getZoom(), 8.5), pitch: 0, duration: 800 });
}

function renderDetail(p) {
  const hy = (HISTORY && HISTORY[selectedGmu]) ? HISTORY[selectedGmu][String(selectedYear)] : null;
  const scoreEl = document.getElementById('dScore');
  const val = unitValue(p);
  scoreEl.textContent = Math.round(metric === 'harvest_score' && hy ? hy.success : (p.hunt_score ?? 0));
  scoreEl.style.color = heatColor((parseFloat(scoreEl.textContent) || 0) / 100);
  document.getElementById('dScoreLabel').textContent =
    metric === 'harvest_score' && selectedYear !== 2024 ? `${selectedYear} SUCCESS %` : 'HUNT SCORE';
  const rows = [
    [`${selectedYear} success`, hy ? `${hy.success}%` : (p.success_pct != null ? `${p.success_pct}%` : '—')],
    [`${selectedYear} hunters`, hy ? hy.hunters.toLocaleString() : (p.hunters || 0).toLocaleString()],
    [`${selectedYear} elk harvested`, hy ? hy.total.toLocaleString() : (p.total_harvest || 0).toLocaleString()],
    ['Harvest / mi² (avg)', UNITS_FMT.dens(p.harvest_density || 0)],
    ['Public land', `${p.public_pct ?? '—'}%`],
    ['Habitat score', p.habitat_score ?? '—'],
  ];
  document.getElementById('dStats').innerHTML = rows.map(([k, v]) =>
    `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('dHist');
  if (!HISTORY || !selectedGmu || !HISTORY[selectedGmu]) { el.innerHTML = ''; return; }
  const hist = HISTORY[selectedGmu];
  const years = Object.keys(hist).sort();
  const maxTotal = Math.max(...years.map(y => hist[y].total), 1);
  const maxHunt = Math.max(...years.map(y => hist[y].hunters), 1);
  const mkBars = (key, max, cls) => years.map(y =>
    `<div class="b ${+y === selectedYear ? 'on' : ''}" data-y="${y}"
       title="${y}: ${hist[y].total} elk · ${hist[y].hunters} hunters · ${hist[y].success}% success">
       <i style="height:${Math.max(2, Math.round(hist[y][key] / max * 38))}px"></i>
     </div>`).join('');
  el.innerHTML = `
    <div class="hist-title">Tap a year — updates detail + map</div>
    <div class="legend2">
      <span><i style="background:var(--accent2)"></i>Elk harvested</span>
      <span><i style="background:#8a6d3f"></i>Hunters</span>
    </div>
    <div class="bars">${mkBars('total', maxTotal, '')}</div>
    <div class="bars hunters">${mkBars('hunters', maxHunt, 'hunters')}</div>
    <div style="display:flex; gap:6px" class="bars-labels">
      ${years.map(y => `<span style="flex:1; text-align:center; font-size:9px; color:${+y === selectedYear ? 'var(--accent2)' : 'var(--dim)'}">${y.slice(2)}</span>`).join('')}
    </div>`;
  el.querySelectorAll('.b').forEach(bEl => bEl.addEventListener('click', () => {
    selectedYear = +bEl.dataset.y;
    renderHistory();
    const p = UNITS.features.find(f => f.properties.gmuid === selectedGmu)?.properties;
    if (p) renderDetail(p);
    ensureUnitLayers();
  }));
}

function loadHotspots(uid) {
  const note = document.getElementById('dHot');
  if (hotspotsCache[uid]) { updateHotspotLayer(); hotspotNote(); return; }
  note.textContent = '🔥 Loading hotspots…';
  fetch(`/data/hotspots/${uid}.geojson`)
    .then(r => { if (!r.ok) throw new Error('none'); return r.json(); })
    .then(gj => {
      hotspotsCache[uid] = gj.features;
      hotspotNote();
      updateHotspotLayer();
      // flyTo/style races: re-apply once the map finishes settling so hotspots ALWAYS paint
      map.once('idle', () => updateHotspotLayer());
    })
    .catch(() => { note.textContent = 'No hotspot grid for this unit (no significant mapped elk habitat).'; });
}
function hotspotNote() {
  const n = hotspotsCache[selectedGmu]?.length || 0;
  document.getElementById('dHot').textContent =
    `🔥 ${n} hotspot cells (smooth heatmap; individual cells at high zoom) — modeled from CPW elk habitat layers × public land. Red = highest habitat-weighted score.`;
}

function deselectUnit() {
  if (selectedGmu != null && map.getSource('gmu-src')) {
    map.setFeatureState({ source: 'gmu-src', id: selectedGmu }, { selected: false });
  }
  selectedGmu = null;
  document.getElementById('detail').classList.remove('show');
  ['gmu-heat', 'gmu-dots'].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
  ensureUnitLayers();
}

// ---------------- markers ----------------
const MK_EMOJI = { camp:'🏕️', sighted:'👁️', harvested:'🏹', parked:'🚗', waypoint:'📍', glassing:'🔭', water:'💧', trailhead:'🥾' };
let markers = [];              // user's markers from server
let markerKindsOn = new Set(Object.keys(MK_EMOJI));
let placingMarker = null;      // {lat,lon} while placing
let markerSymbolAdded = false;

async function loadMarkers() {
  try {
    const r = await fetch('/api/markers');
    if (!r.ok) return;
    const d = await r.json();
    markers = d.markers || [];
    updateMarkerLayer();
    renderMarkerList();
  } catch (e) { /* not signed in / old build */ }
}

function updateMarkerLayer() {
  if (!map.isStyleLoaded()) return;
  const visible = markers.filter(m => markerKindsOn.has(m.kind));
  const fc = {
    type: 'FeatureCollection',
    features: visible.map(m => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [m.lon, m.lat] },
      properties: { id: m.id, name: m.name || '', notes: m.notes || '', emoji: MK_EMOJI[m.kind] || '📍' },
    })),
  };
  if (!map.getSource('markers-src')) {
    map.addSource('markers-src', { type: 'geojson', data: fc });
  } else {
    map.getSource('markers-src').setData(fc);
  }
  if (!map.getLayer('markers-dots')) {
    map.addLayer({
      id: 'markers-dots', type: 'symbol', source: 'markers-src',
      layout: {
        'text-field': ['get', 'emoji'],
        'text-size': 16,
        'text-allow-overlap': true,
      },
      paint: { 'text-opacity': 0.95 },
    });
  }
  // popup on click
  if (!window._markersClickWired) {
    window._markersClickWired = true;
    map.on('click', 'markers-dots', e => {
      const p = e.features[0].properties;
      const html = `<strong>${p.emoji || ''} ${p.name || p.kind}</strong>` +
        (p.notes ? `<br><span style="font-size:12px">${p.notes}</span>` : '') +
        `<br><button onclick="deleteMarker(${p.id})" style="margin-top:6px;padding:3px 8px;font-size:11px;background:#7f1d1d;color:#fff;border:none;border-radius:4px;cursor:pointer">Delete</button>`;
      new maplibregl.Popup({ offset: 12 })
        .setLngLat(e.features[0].geometry.coordinates)
        .setHTML(html).addTo(map);
    });
    map.on('mouseenter', 'markers-dots', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'markers-dots', () => map.getCanvas().style.cursor = '');
  }
}

async function deleteMarker(id) {
  await fetch('/api/markers/delete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id }),
  });
  markers = markers.filter(m => m.id !== id);
  updateMarkerLayer();
  renderMarkerList();
}
window.deleteMarker = deleteMarker;

function renderMarkerList() {
  const el = document.getElementById('markerList');
  if (!markers.length) { el.innerHTML = '<div style="font-size:11px;color:#8fa3c8">No markers yet — click "Add marker" then click the map.</div>'; return; }
  el.innerHTML = markers.map(m =>
    `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;color:#dbe7ff">
       <span>${MK_EMOJI[m.kind] || '📍'}</span>
       <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.name || m.kind}</span>
       <button onclick="deleteMarker(${m.id})" style="background:none;border:none;color:#8fa3c8;cursor:pointer;font-size:11px">✕</button>
     </div>`).join('');
}

// ---------------- unit list ----------------
function visibleUnits() {
  const b = map.getBounds();
  const w = b.getWest(), e = b.getEast(), s = b.getSouth(), n = b.getNorth();
  return UNITS.features.filter(f => {
    const [x, y] = f.properties._c;
    return x >= w && x <= e && y >= s && y <= n;
  });
}
function renderUnitList() {
  if (!UNITS) return;
  const vis = visibleUnits();
  const rows = vis.map(f => f.properties)
    .filter(p => unitValue(p) >= minScore)
    .sort((a, b) => unitValue(b) - unitValue(a)).slice(0, 50);
  document.getElementById('listMeta').textContent =
    `Top units in view · ${vis.length} on map · z${map.getZoom().toFixed(1)}`;
  const list = document.getElementById('unitList');
  list.innerHTML = rows.map(p => `
    <div class="unit-row ${p.gmuid === selectedGmu ? 'sel' : ''}" data-gmu="${p.gmuid}">
      <div class="gmu">${p.gmuid}</div>
      <div class="bar"><i style="width:${Math.min(unitValue(p), 100)}%"></i></div>
      <div class="score">${Math.round(unitValue(p))}</div>
    </div>`).join('');
  list.querySelectorAll('.unit-row').forEach(el =>
    el.addEventListener('click', () => {
      const uid = +el.dataset.gmu;
      if (selectedGmu === uid) deselectUnit(); else selectUnit(uid);
    }));
}
let listTimer = null;
map.on('moveend', () => {

  listTimer = setTimeout(() => { listTimer = null; renderUnitList(); }, 150);
});

  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('.collapse-btn')) return;
    if (window.innerWidth < 720) return;
    dragging = true; sx = e.clientX; sy = e.clientY;
    const r = panel.getBoundingClientRect();
    ox = r.left; oy = r.top;
    panel.style.left = ox + 'px'; panel.style.top = oy + 'px';
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e => {
    if (!dragging) return;
    panel.style.left = Math.max(0, Math.min(window.innerWidth - 120, ox + e.clientX - sx)) + 'px';
    panel.style.top = Math.max(0, Math.min(window.innerHeight - 40, oy + e.clientY - sy)) + 'px';
  });
  head.addEventListener('pointerup', () => { dragging = false; });

  const chip = e.target.closest('.chip'); if (!chip) return;
  document.querySelectorAll('#layerToggles .chip').forEach(c => c.classList.toggle('on', c === chip));
  habitatLayer = chip.dataset.l;
  // show/hide the opacity slider (only when a habitat layer is active)
  document.getElementById('habitatOpacityField').style.display =
    habitatLayer === 'none' ? 'none' : 'flex';
  ensureUnitLayers();
});
const habOpEl = document.getElementById('habitatOpacity');
habOpEl.addEventListener('input', () => {
  habitatOpacity = +habOpEl.value / 100;
  document.getElementById('habitatOpacityVal').textContent = habOpEl.value;
  if (map.getLayer('habitat-fill')) map.setPaintProperty('habitat-fill', 'fill-opacity', habitatOpacity);
});

// ---------------- lifecycle ----------------
map.on('style.load', () => {
  // style switch wipes sources/layers/terrain — rebuild all
  if (terrainOn) setTerrain(true);
  ensureUnitLayers();
  updateHotspotLayer();
});
map.on('idle', () => {
  // safety net: if layers got dropped (style race), re-ensure
  if (UNITS && !map.getLayer('gmu-fill') && map.isStyleLoaded()) ensureUnitLayers();
});
map.on('load', async () => {
  try {
    const [uRes, hRes] = await Promise.all([
      fetch('/data/units.geojson'), fetch('/data/harvest_history.json')]);
    if (!uRes.ok) throw new Error('HTTP ' + uRes.status);
    UNITS = await uRes.json();
    HISTORY = hRes.ok ? await hRes.json() : null;
    UNITS.features.forEach(f => { f.properties._c = centroidOf(f); });
    wireClicks();
    ensureUnitLayers();
    loadMarkers();   // user markers
  } catch (err) {
    document.querySelector('.unit-list').innerHTML =
      `<div style="padding:12px;color:#ff6b35;font-size:12px">Failed to load: ${err.message}</div>`;
  }
});
</script>

<!-- auth state chip -->
<script>
(async () => {
  try {
    const r = await fetch('/api/me');
    const d = await r.json();
    const chip = document.createElement('a');
    chip.href = d.user ? '/admin.html' : '/login.html';
    chip.style.cssText = 'position:fixed;top:12px;right:12px;z-index:9999;background:#0f766e;color:#fff;' +
      'padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;text-decoration:none;' +
      'box-shadow:0 2px 8px rgba(0,0,0,.4);font-family:system-ui,sans-serif';
    chip.textContent = d.user ? ('⚙ ' + (d.user.role === 'admin' ? 'Admin' : d.user.name)) : '🔐 Sign in';
    document.body.appendChild(chip);
    if (d.user) {
      const out = document.createElement('a');
      out.href = '#';
      out.style.cssText = 'position:fixed;top:12px;right:' + (chip.offsetWidth + 24) + 'px;z-index:9999;' +
        'color:#94a3b8;font-size:13px;text-decoration:none;font-family:system-ui,sans-serif';
      out.textContent = 'Sign out';
      out.onclick = async (e) => { e.preventDefault(); await fetch('/api/logout', {method:'POST'}); location.reload(); };
      document.body.appendChild(out);
    }
  } catch (e) { /* auth endpoints missing = old build, ignore */ }
})();
</script>
