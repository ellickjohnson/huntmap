<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HuntMap — Colorado Elk Units</title>
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.1.12/dist.min.js"></script>
<style>
  :root {
    --bg: #0f1419; --panel: #1a222b; --panel2: #232d38; --line: #2e3a46;
    --txt: #e8edf2; --dim: #8fa0b0; --accent: #ff6b35; --accent2: #4ecdc4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--txt); overflow: hidden; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; top: 12px; left: 12px; z-index: 10; width: 340px;
    background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    max-height: calc(100vh - 24px); display: flex; flex-direction: column;
    transition: width .25s ease; }
  .panel.collapsed { width: auto; }
  .panel-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; }
  .panel.collapsed .panel-header { border-bottom: 0; }
  .panel-header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; flex: 1; }
  .panel-header h1 span { color: var(--accent); }
  .collapse-btn { background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; width: 30px; height: 30px; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .collapse-btn:hover { color: var(--txt); border-color: var(--accent2); }
  .panel-body { display: flex; flex-direction: column; overflow: hidden; }
  .panel.collapsed .panel-body { display: none; }
  .panel-header .sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .controls { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .seg { display: flex; background: var(--panel2); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; padding: 7px 0; border: 0; background: transparent; color: var(--dim);
    border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .seg button.active { background: var(--accent); color: #fff; }
  .seg button:hover:not(.active) { color: var(--txt); }
  .field { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .field label { color: var(--dim); width: 86px; flex-shrink: 0; }
  .field input[type=range] { flex: 1; accent-color: var(--accent); }
  .field .val { width: 34px; text-align: right; color: var(--txt); font-variant-numeric: tabular-nums; }
  .toggles { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 10.5px; padding: 4px 9px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--dim); cursor: pointer; user-select: none; transition: all .15s; }
  .chip.on { border-color: var(--accent2); color: var(--accent2); background: rgba(78,205,196,.08); }
  .list-meta { padding: 8px 14px 0; font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; }
  .unit-list { overflow-y: auto; flex: 1; padding: 6px 8px 12px; min-height: 120px; }
  .unit-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; transition: background .12s; }
  .unit-row:hover, .unit-row.sel { background: var(--panel2); }
  .unit-row .gmu { font-weight: 700; font-size: 14px; width: 44px; }
  .unit-row .bar { flex: 1; height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .unit-row .bar i { display: block; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #0e7490, #22c55e, #facc15, #ef4444); }
  .unit-row .score { width: 36px; text-align: right; font-size: 13px; font-weight: 700; color: var(--accent2); }
  .detail { position: absolute; right: 12px; top: 12px; z-index: 10; width: 300px;
    background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    padding: 16px; display: none; max-height: calc(100vh - 24px); overflow-y: auto; }
  .detail.show { display: block; }
  .detail .detail-head { display: flex; align-items: flex-start; }
  .detail h2 { font-size: 20px; flex: 1; }
  .detail .close-btn { background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 6px; width: 26px; height: 26px; font-size: 13px; cursor: pointer; line-height: 1; }
  .detail .close-btn:hover { color: var(--txt); border-color: var(--accent); }
  .detail .county { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .stat:last-child { border-bottom: 0; }
  .stat .k { color: var(--dim); }
  .stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .bigscore { text-align: center; margin: 8px 0 14px; }
  .bigscore .n { font-size: 42px; font-weight: 800; line-height: 1; }
  .bigscore .l { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); }
  .hist { margin: 10px 0 4px; }
  .hist .hist-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .hist .hist-title b { color: var(--accent2); cursor: pointer; }
  .hist .bars { display: flex; align-items: flex-end; gap: 6px; height: 54px; }
  .hist .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
  .hist .bars .b i { display: block; width: 100%; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, var(--accent2), #0e7490); opacity: .55; transition: opacity .15s; }
  .hist .bars .b.on i, .hist .bars .b:hover i { opacity: 1; }
  .hist .bars .b span { font-size: 9px; color: var(--dim); }
  .hot-note { font-size: 10px; color: var(--dim); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); line-height: 1.5; }
  #legend { position: absolute; bottom: 18px; left: 12px; z-index: 10;
    background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; font-size: 11px; color: var(--dim); }
  #legend .grad { height: 10px; width: 180px; border-radius: 5px; margin: 5px 0 3px;
    background: linear-gradient(90deg, #181c34, #0e7490, #22c55e, #facc15, #ef4444); }
  .maplibregl-ctrl-attrib { background: rgba(15,20,25,.7) !important; color: var(--dim) !important; }
  .maplibregl-ctrl-attrib a { color: var(--dim) !important; }
  @media (max-width: 720px) {
    .panel { width: calc(100vw - 24px); max-height: 48vh; }
    .detail { width: calc(100vw - 24px); top: auto; bottom: 12px; max-height: 42vh; }
    #legend { display: none; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="sidePanel">
  <div class="panel-header">
    <h1>Elk<span>HuntMap</span> 🦌</h1>
    <button class="collapse-btn" id="panelToggle" title="Collapse panel">◀</button>
  </div>
  <div class="panel-body">
    <div class="controls">
      <div class="seg" id="metricSeg">
        <button data-m="hunt_score" class="active">Overall</button>
        <button data-m="harvest_score">Success</button>
        <button data-m="habitat_score">Habitat</button>
        <button data-m="public_pct">Public Land</button>
      </div>
      <div class="field">
        <label>Basemap</label>
        <div class="seg" id="baseSeg" style="flex:1">
          <button data-b="dark" class="active">Dark</button>
          <button data-b="satellite">Satellite</button>
          <button data-b="topo">Topo/Roads</button>
        </div>
      </div>
      <div class="toggles">
        <span class="chip" id="terrainChip" data-t="terrain">⛰️ 3D Terrain</span>
        <span class="chip on" id="unit3dChip" data-t="units3d">3D Units</span>
      </div>
      <div class="field">
        <label>Min score</label>
        <input type="range" id="minScore" min="0" max="100" value="0"/>
        <span class="val" id="minScoreVal">0</span>
      </div>
      <div class="field" id="extrudeField">
        <label>3D height</label>
        <input type="range" id="extrude" min="0" max="100" value="35"/>
        <span class="val" id="extrudeVal">35</span>
      </div>
      <div class="toggles" id="layerToggles">
        <span class="chip on" data-l="none">Heatmap only</span>
        <span class="chip" data-l="elk_summer_concentration">Summer concentration</span>
        <span class="chip" data-l="elk_resident_population">Resident population</span>
        <span class="chip" data-l="elk_winter_concentration">Winter concentration</span>
        <span class="chip" data-l="elk_migration_corridors">Migration corridors</span>
      </div>
    </div>
    <div class="list-meta" id="listMeta"></div>
    <div class="unit-list" id="unitList"></div>
  </div>
</div>
<div class="detail" id="detail">
  <div class="detail-head"><h2 id="dTitle"></h2><button class="close-btn" id="detailClose">✕</button></div>
  <div class="county" id="dCounty"></div>
  <div class="bigscore"><div class="n" id="dScore"></div><div class="l" id="dScoreLabel">HUNT SCORE</div></div>
  <div id="dStats"></div>
  <div class="hist" id="dHist"></div>
  <div class="hot-note" id="dHot"></div>
</div>
<div id="legend">
  <div id="legendLabel">Hunt score</div>
  <div class="grad"></div>
  <div style="display:flex; justify-content:space-between"><span>low</span><span>high</span></div>
</div>

<script type="module">
const deck = window.deck;
const maplibregl = window.maplibregl;

// ---------- basemaps ----------
const BASEMAPS = {
  dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  satellite: 'https://basemaps.cartocdn.com/gl/global-satellite-gl-style/style.json',
  topo: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
};
let terrainOn = false;
let units3dOn = true;

const map = new maplibregl.Map({
  container: 'map',
  style: BASEMAPS.dark,
  center: [-105.9, 39.6], zoom: 7.2, pitch: 0, attributionControl: true
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

// terrain source (Amazon AWS Terrain Tiles via maplibre demo terrarium endpoint)
const TERRAIN_DEM = 'https://demotiles.maplibre.org/terrain-tiles/tiles.json';

async function setTerrain(on) {
  if (on) {
    if (!map.getSource('terrain-dem')) {
      map.addSource('terrain-dem', { type: 'raster-dem', url: TERRAIN_DEM, tileSize: 256 });
    }
    map.setTerrain({ source: 'terrain-dem', exaggeration: 1.2 });
  } else {
    map.setTerrain(null);
  }
}

let UNITS = null;
let HISTORY = null;
let metric = 'hunt_score';
let minScore = 0;
let extrudeAmt = 0.35;
let habitatLayer = 'none';
let selectedGmu = null;
let selectedYear = 2024;
let deckOverlay = null;
let hotspotsCache = {};

const RAMP = [
  [0.00, [24, 28, 52]],
  [0.30, [14, 116, 144]],
  [0.55, [34, 197, 94]],
  [0.75, [250, 204, 21]],
  [0.88, [239, 68, 68]],
  [1.00, [190, 18, 60]],
];
function heatColor(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < RAMP.length - 1; i++) {
    const [t0, c0] = RAMP[i], [t1, c1] = RAMP[i + 1];
    if (t >= t0 && t <= t1) {
      const a = (t - t0) / (t1 - t0);
      return c0.map((v, k) => Math.round(v + (c1[k] - v) * a));
    }
  }
  return RAMP[RAMP.length - 1][1];
}
const hotColor = t => {
  t = Math.max(0, Math.min(1, t));
  // hotspots: teal (low) -> yellow -> red-hot (high)
  if (t < 0.5) { const a = t / 0.5; return [14 + (250 - 14) * a, 116 + (204 - 116) * a, 144 + (21 - 144) * a]; }
  const a = (t - 0.5) / 0.5; return [250 + (255 - 250) * a, 204 + (80 - 204) * a, 21 + (30 - 21) * a];
};

function centroidOf(f) {
  const rings = f.geometry.type === 'Polygon' ? [f.geometry.coordinates[0]]
    : f.geometry.coordinates.map(p => p[0]);
  let xs = [], ys = [];
  rings.forEach(r => r.forEach(pt => { xs.push(pt[0]); ys.push(pt[1]); }));
  return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
}

function unitValue(p) {
  // metric value, possibly overridden by historical year selection
  if (metric !== 'harvest_score' || selectedYear === 2024 || !HISTORY) return p[metric] || 0;
  const h = (HISTORY[p.gmuid] || {})[String(selectedYear)];
  return h ? h.success : 0;
}

function buildLayers() {
  if (!UNITS) return;
  const layers = [];
  layers.push(new deck.GeoJsonLayer({
    id: 'gmu',
    data: UNITS,
    pickable: true,
    stroked: true,
    getLineColor: d => (d.properties.gmuid === selectedGmu ? [78, 205, 196, 255] : [70, 85, 100, 180]),
    getLineWidth: d => (d.properties.gmuid === selectedGmu ? 7 : 1),
    lineWidthMinPixels: 1,
    lineWidthMaxPixels: 7,
    extruded: units3dOn && extrudeAmt > 0,
    wireframe: units3dOn && extrudeAmt > 0,
    getElevation: d => unitValue(d.properties) * extrudeAmt * 120,
    getFillColor: d => {
      const v = unitValue(d.properties);
      if (minScore > 0 && v < minScore) return [30, 36, 44, 90];
      return heatColor(v / 100).concat([200]);
    },
    onClick: info => {
      if (!info.object) return;
      const uid = info.object.properties.gmuid;
      if (selectedGmu === uid) deselectUnit();
      else selectUnit(uid);
    },
    updateTriggers: {
      getFillColor: [metric, minScore, selectedYear],
      getElevation: [metric, extrudeAmt, selectedYear, units3dOn],
      getLineColor: [selectedGmu],
      getLineWidth: [selectedGmu],
    },
    transitions: { getElevation: 300, getFillColor: 250, getLineWidth: 150 },
  }));
  if (habitatLayer !== 'none') {
    layers.push(new deck.GeoJsonLayer({
      id: 'habitat',
      data: `/data/${habitatLayer}.geojson`,
      stroked: false,
      getFillColor: [78, 205, 196, 42],
      pickable: false,
    }));
  }
  // hotspot dots for selected unit
  if (selectedGmu && hotspotsCache[selectedGmu]) {
    const hs = hotspotsCache[selectedGmu];
    layers.push(new deck.ScatterplotLayer({
      id: 'hotspots',
      data: hs.features,
      pickable: true,
      radiusUnits: 'meters',
      getRadius: 320,
      radiusMinPixels: 3,
      radiusMaxPixels: 12,
      getFillColor: d => hotColor((d.properties.s || 0) / 100).concat([220]),
      getLineColor: [0, 0, 0, 120],
      stroked: false,
      updateTriggers: { getFillColor: [selectedGmu] },
    }));
  }
  if (deckOverlay) { deckOverlay.setProps({ layers }); }
  else {
    deckOverlay = new deck.MapboxOverlay({ layers });
    map.addControl(deckOverlay);
  }
  renderUnitList();
}

function selectUnit(uid) {
  selectedGmu = uid;
  const u = UNITS.features.find(f => f.properties.gmuid === uid);
  if (!u) return;
  const p = u.properties;
  document.getElementById('dTitle').textContent = `GMU ${p.gmuid}`;
  document.getElementById('dCounty').textContent =
    `${p.county || ''} · herd ${p.elk_dau || '—'} · ${Math.round(p.sq_miles)} mi²`;
  const scoreEl = document.getElementById('dScore');
  scoreEl.textContent = Math.round(unitValue(p));
  scoreEl.style.color = `rgb(${heatColor((unitValue(p) || 0) / 100).join(',')})`;
  document.getElementById('dScoreLabel').textContent =
    (metric === 'harvest_score' && selectedYear !== 2024) ? `${selectedYear} SUCCESS %` : 'HUNT SCORE';
  const rows = [
    ['2024 success', `${p.success_pct ?? '—'}%`],
    ['Hunters (all seasons)', (p.hunters || 0).toLocaleString()],
    ['Elk harvested', (p.total_harvest || 0).toLocaleString()],
    ['Harvest / mi²', (p.harvest_density || 0).toFixed(2)],
    ['Public land', `${p.public_pct ?? '—'}%`],
    ['Habitat score', p.habitat_score ?? '—'],
  ];
  document.getElementById('dStats').innerHTML = rows.map(([k, v]) =>
    `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  renderHistory(p);
  document.getElementById('detail').classList.add('show');
  buildLayers();
  loadHotspots(uid);
  const c = centroidOf(u);
  map.flyTo({ center: c, zoom: Math.max(map.getZoom(), 8.5), pitch: Math.max(map.getPitch(), 45), duration: 900 });
}

function renderHistory() {
  const el = document.getElementById('dHist');
  if (!HISTORY || !selectedGmu || !HISTORY[selectedGmu]) { el.innerHTML = ''; return; }
  const years = Object.keys(HISTORY[selectedGmu]).sort();
  const maxTotal = Math.max(...years.map(y => HISTORY[selectedGmu][y].total), 1);
  const bars = years.map(y => {
    const h = HISTORY[selectedGmu][y];
    const on = (y === String(selectedYear)) ? 'on' : '';
    return `<div class="b ${on}" data-y="${y}" title="${y}: ${h.total} elk, ${h.success}% success, ${h.hunters} hunters">
      <i style="height:${Math.round(h.total / maxTotal * 40) + 2}px"></i><span>${y.slice(2)}</span></div>`;
  }).join('');
  el.innerHTML = `<div class="hist-title"><span>Harvest history · tap a year</span><b id="histYear">${selectedYear}</b></div>
    <div class="bars">${bars}</div>`;
  el.querySelectorAll('.b').forEach(bEl => bEl.addEventListener('click', () => {
    selectedYear = +bEl.dataset.y;
    document.getElementById('histYear').textContent = selectedYear;
    const h = (HISTORY[selectedGmu] || {})[String(selectedYear)];
    if (h && metric === 'harvest_score') {
      document.getElementById('dScore').textContent = h.success;
    }
    buildLayers();
  }));
  if (metric === 'harvest_score') {
    document.querySelector('#dHist .hist-title span').textContent = 'Success by year · tap to color map';
  }
}

function loadHotspots(uid) {
  const note = document.getElementById('dHot');
  if (hotspotsCache[uid]) { note.textContent = hotspotNoteText(); return; }
  fetch(`/data/hotspots/${uid}.geojson`)
    .then(r => { if (!r.ok) throw new Error('none'); return r.json(); })
    .then(gj => {
      hotspotsCache[uid] = gj.features;
      note.textContent = hotspotNoteText();
      buildLayers();
    })
    .catch(() => {
      note.textContent = 'No hotspot grid for this unit (no significant elk habitat mapped).';
    });
}
function hotspotNoteText() {
  const n = hotspotsCache[selectedGmu]?.length || 0;
  return `🔥 ${n} hotspot cells — modeled from CPW elk habitat layers × public land. Red-hot = highest habitat-weighted score, blue = moderate. Click a dot to see its score. Directional: hunt the red clusters, prioritize public-land cells (darker stroke).`;
}

function deselectUnit() {
  selectedGmu = null;
  document.getElementById('detail').classList.remove('show');
  buildLayers();
}

function visibleUnits() {
  const b = map.getBounds();
  const w = b.getWest(), e = b.getEast(), s = b.getSouth(), n = b.getNorth();
  return UNITS.features.filter(f => {
    const [x, y] = f.properties._c;
    return x >= w && x <= e && y >= s && y <= n;
  });
}

function renderUnitList() {
  if (!UNITS) return;
  const vis = visibleUnits();
  const rows = vis
    .map(f => f.properties)
    .filter(p => unitValue(p) >= minScore)
    .sort((a, b) => unitValue(b) - unitValue(a))
    .slice(0, 50);
  document.getElementById('listMeta').textContent =
    `Top units in view · ${vis.length} on map · z${map.getZoom().toFixed(1)}`;
  const list = document.getElementById('unitList');
  list.innerHTML = rows.map(p => `
    <div class="unit-row ${p.gmuid === selectedGmu ? 'sel' : ''}" data-gmu="${p.gmuid}">
      <div class="gmu">${p.gmuid}</div>
      <div class="bar"><i style="width:${Math.min(unitValue(p), 100)}%"></i></div>
      <div class="score">${Math.round(unitValue(p))}</div>
    </div>`).join('');
  list.querySelectorAll('.unit-row').forEach(el =>
    el.addEventListener('click', () => {
      const uid = +el.dataset.gmu;
      if (selectedGmu === uid) deselectUnit(); else selectUnit(uid);
    }));
}

let listTimer = null;
function scheduleListRender() {
  if (listTimer) return;
  listTimer = setTimeout(() => { listTimer = null; if (UNITS) renderUnitList(); }, 150);
}
map.on('moveend', scheduleListRender);
map.on('zoomend', scheduleListRender);

// ---- UI wiring ----
const panelToggle = document.getElementById('panelToggle');
panelToggle.addEventListener('click', () => {
  const p = document.getElementById('sidePanel');
  const collapsed = p.classList.toggle('collapsed');
  panelToggle.textContent = collapsed ? '▶' : '◀';
});
if (window.innerWidth < 720) {
  document.getElementById('sidePanel').classList.add('collapsed');
  panelToggle.textContent = '▶';
}
document.getElementById('detailClose').addEventListener('click', deselectUnit);

document.getElementById('baseSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#baseSeg button').forEach(x => x.classList.toggle('active', x === b));
  map.setStyle(BASEMAPS[b.dataset.b]);
});
const unit3dChip = document.getElementById('unit3dChip');
unit3dChip.addEventListener('click', () => {
  units3dOn = !units3dOn;
  unit3dChip.classList.toggle('on', units3dOn);
  if (units3dOn) terrainOn = false;
  document.getElementById('terrainChip').classList.toggle('on', terrainOn);
  document.getElementById('extrudeField').style.display = units3dOn ? 'flex' : 'none';
  setTerrain(terrainOn);
  buildLayers();
});
const terrainChip = document.getElementById('terrainChip');
terrainChip.addEventListener('click', () => {
  terrainOn = !terrainOn;
  terrainChip.classList.toggle('on', terrainOn);
  if (terrainOn) units3dOn = false;
  unit3dChip.classList.toggle('on', units3dOn);
  document.getElementById('extrudeField').style.display = units3dOn ? 'flex' : 'none';
  setTerrain(terrainOn);
  buildLayers();
});

document.getElementById('metricSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#metricSeg button').forEach(x => x.classList.toggle('active', x === b));
  metric = b.dataset.m;
  document.getElementById('legendLabel').textContent = b.textContent + ' score';
  buildLayers();
});
const minScoreEl = document.getElementById('minScore');
minScoreEl.addEventListener('input', () => {
  minScore = +minScoreEl.value;
  document.getElementById('minScoreVal').textContent = minScore;
  buildLayers();
});
const extrudeEl = document.getElementById('extrude');
extrudeEl.addEventListener('input', () => {
  extrudeAmt = +extrudeEl.value / 100;
  document.getElementById('extrudeVal').textContent = extrudeEl.value;
  buildLayers();
});
document.getElementById('layerToggles').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  document.querySelectorAll('#layerToggles .chip').forEach(c => c.classList.toggle('on', c === chip));
  habitatLayer = chip.dataset.l;
  buildLayers();
});

map.on('style.load', () => {
  // re-apply terrain after basemap switch
  if (terrainOn) setTerrain(true);
  // deck overlay survives setStyle via mapbox overlay control, but re-add if needed
  if (deckOverlay && !map.hasControl(deckOverlay)) map.addControl(deckOverlay);
  buildLayers();
});

map.on('load', async () => {
  try {
    const [uRes, hRes] = await Promise.all([
      fetch('/data/units.geojson'),
      fetch('/data/harvest_history.json'),
    ]);
    if (!uRes.ok) throw new Error('HTTP ' + uRes.status);
    UNITS = await uRes.json();
    HISTORY = hRes.ok ? await hRes.json() : null;
    UNITS.features.forEach(f => { f.properties._c = centroidOf(f); });
    buildLayers();
  } catch (err) {
    document.querySelector('.unit-list').innerHTML =
      `<div style="padding:12px;color:#ff6b35;font-size:12px">Failed to load unit data: ${err.message}<br>Retry in a moment.</div>`;
  }
});
</script>
</body>
</html>
