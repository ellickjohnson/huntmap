<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HuntMap — Colorado Elk Units</title>
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.1.12/dist.min.js"></script>
<style>
  :root {
    --bg: #0f1419; --panel: #1a222b; --panel2: #232d38; --line: #2e3a46;
    --txt: #e8edf2; --dim: #8fa0b0; --accent: #ff6b35; --accent2: #4ecdc4;
    --heat0: #1a2332; --heat1: #f0a500; --heat2: #ff4500;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--txt); overflow: hidden; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; top: 12px; left: 12px; z-index: 10; width: 340px;
    background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
  .panel-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .panel-header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .panel-header h1 span { color: var(--accent); }
  .panel-header .sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .controls { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .seg { display: flex; background: var(--panel2); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; padding: 7px 0; border: 0; background: transparent; color: var(--dim);
    border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .seg button.active { background: var(--accent); color: #fff; }
  .seg button:hover:not(.active) { color: var(--txt); }
  .field { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .field label { color: var(--dim); width: 86px; flex-shrink: 0; }
  .field input[type=range] { flex: 1; accent-color: var(--accent); }
  .field .val { width: 34px; text-align: right; color: var(--txt); font-variant-numeric: tabular-nums; }
  .toggles { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 10.5px; padding: 4px 9px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--dim); cursor: pointer; user-select: none; transition: all .15s; }
  .chip.on { border-color: var(--accent2); color: var(--accent2); background: rgba(78,205,196,.08); }
  .unit-list { overflow-y: auto; flex: 1; padding: 6px 8px 12px; }
  .unit-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; transition: background .12s; }
  .unit-row:hover, .unit-row.sel { background: var(--panel2); }
  .unit-row .gmu { font-weight: 700; font-size: 14px; width: 44px; }
  .unit-row .bar { flex: 1; height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .unit-row .bar i { display: block; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--heat1), var(--heat2)); }
  .unit-row .score { width: 36px; text-align: right; font-size: 13px; font-weight: 700; color: var(--heat1); }
  .detail { position: absolute; right: 12px; top: 12px; z-index: 10; width: 300px;
    background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    padding: 16px; display: none; }
  .detail.show { display: block; }
  .detail h2 { font-size: 20px; margin-bottom: 1px; }
  .detail .county { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .stat:last-child { border-bottom: 0; }
  .stat .k { color: var(--dim); }
  .stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .bigscore { text-align: center; margin: 8px 0 14px; }
  .bigscore .n { font-size: 42px; font-weight: 800; color: var(--heat1); line-height: 1; }
  .bigscore .l { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); }
  #legend { position: absolute; bottom: 18px; left: 12px; z-index: 10;
    background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; font-size: 11px; color: var(--dim); }
  #legend .grad { height: 10px; width: 180px; border-radius: 5px; margin: 5px 0 3px;
    background: linear-gradient(90deg, var(--heat0), var(--heat1), var(--heat2)); }
  .maplibregl-ctrl-attrib { background: rgba(15,20,25,.7) !important; color: var(--dim) !important; }
  .maplibregl-ctrl-attrib a { color: var(--dim) !important; }
  @media (max-width: 720px) { .panel { width: calc(100vw - 24px); max-height: 55vh; } .detail { width: calc(100vw - 24px); top: auto; bottom: 12px; max-height: 40vh; overflow-y: auto; } }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="panel-header">
    <h1>Elk<span>HuntMap</span> 🦌</h1>
    <div class="sub">Colorado GMUs · CPW 2024 harvest + habitat</div>
  </div>
  <div class="controls">
    <div class="seg" id="metricSeg">
      <button data-m="hunt_score" class="active">Overall</button>
      <button data-m="harvest_score">Success</button>
      <button data-m="habitat_score">Habitat</button>
      <button data-m="public_pct">Public Land</button>
    </div>
    <div class="field">
      <label>Min score</label>
      <input type="range" id="minScore" min="0" max="100" value="0"/>
      <span class="val" id="minScoreVal">0</span>
    </div>
    <div class="field">
      <label>3D height</label>
      <input type="range" id="extrude" min="0" max="100" value="35"/>
      <span class="val" id="extrudeVal">35</span>
    </div>
    <div class="toggles" id="layerToggles">
      <span class="chip on" data-l="none">Heatmap only</span>
      <span class="chip" data-l="elk_summer_concentration">Summer concentration</span>
      <span class="chip" data-l="elk_resident_population">Resident population</span>
      <span class="chip" data-l="elk_winter_concentration">Winter concentration</span>
      <span class="chip" data-l="elk_migration_corridors">Migration corridors</span>
    </div>
  </div>
  <div class="unit-list" id="unitList"></div>
</div>
<div class="detail" id="detail"></div>
<div id="legend">
  <div id="legendLabel">Hunt score</div>
  <div class="grad"></div>
  <div style="display:flex; justify-content:space-between"><span>low</span><span>high</span></div>
</div>

<script type="module">
const deck = window.deck;
const maplibregl = window.maplibregl;

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [-105.9, 39.6], zoom: 7.2, pitch: 0, attributionControl: true
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

let UNITS = null;
let metric = 'hunt_score';
let minScore = 0;
let extrudeAmt = 0.35;
let habitatLayer = 'none';
let deckOverlay = null;
let selectedGmu = null;

const stateToFIPS = '08';

function heatColor(t) {
  // 0 -> deep blue-gray, 0.5 -> amber, 1 -> red-orange
  t = Math.max(0, Math.min(1, t));
  if (t < 0.5) {
    const a = t / 0.5;
    return [26 + (240 - 26) * a, 35 + (165 - 35) * a, 50 + (0 - 50) * a];
  }
  const a = (t - 0.5) / 0.5;
  return [240 + (255 - 240) * a, 165 + (69 - 165) * a, 0];
}

function metricDomain() {
  if (metric === 'public_pct') return [0, 100];
  return [0, 100];
}

function buildLayers() {
  if (!UNITS) return;
  const [dlo, dhi] = metricDomain();
  const polygonsLayer = new deck.GeoJsonLayer({
    id: 'gmu',
    data: UNITS,
    pickable: true,
    stroked: true,
    getLineColor: d => (d.properties.gmuid === selectedGmu ? [78, 205, 196, 255] : [70, 85, 100, 180]),
    getLineWidth: d => (d.properties.gmuid === selectedGmu ? 3 : 1),
    lineWidthMinPixels: 1,
    extruded: extrudeAmt > 0,
    wireframe: true,
    getElevation: d => (metric !== 'public_pct'
      ? (d.properties[metric] || 0) * extrudeAmt * 120
      : (d.properties[metric] || 0) * extrudeAmt * 40),
    getFillColor: d => {
      const v = d.properties[metric] || 0;
      if (minScore > 0 && v < minScore) return [30, 36, 44, 90];
      const t = (v - dlo) / Math.max(1, (dhi - dlo));
      return heatColor(t).concat([200]);
    },
    onClick: info => { if (info.object) selectUnit(info.object.properties.gmuid); },
    updateTriggers: {
      getFillColor: [metric, minScore],
      getElevation: [metric, extrudeAmt],
      getLineColor: [selectedGmu],
    },
    transitions: { getElevation: 300, getFillColor: 250 },
  });
  const layers = [polygonsLayer];
  if (habitatLayer !== 'none') {
    layers.push(new deck.GeoJsonLayer({
      id: 'habitat',
      data: `/data/${habitatLayer}.geojson`,
      stroked: false,
      getFillColor: [78, 205, 196, 42],
      pickable: false,
      loadOptions: {},
    }));
  }
  if (deckOverlay) { deckOverlay.setProps({ layers }); }
  else {
    deckOverlay = new deck.MapboxOverlay({ layers });
    map.addControl(deckOverlay);
  }
  renderUnitList();
}

function selectUnit(uid) {
  selectedGmu = uid;
  const u = UNITS.features.find(f => f.properties.gmuid === uid);
  if (!u) return;
  const p = u.properties;
  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <h2>GMU ${p.gmuid}</h2>
    <div class="county">${p.county || ''} · herd ${p.elk_dau || '—'} · ${Math.round(p.sq_miles)} mi²</div>
    <div class="bigscore"><div class="n">${p.hunt_score ?? '—'}</div><div class="l">HUNT SCORE</div></div>
    <div class="stat"><span class="k">2024 success</span><span class="v">${p.success_pct ?? '—'}%</span></div>
    <div class="stat"><span class="k">Hunters (all seasons)</span><span class="v">${(p.hunters || 0).toLocaleString()}</span></div>
    <div class="stat"><span class="k">Elk harvested</span><span class="v">${(p.total_harvest || 0).toLocaleString()}</span></div>
    <div class="stat"><span class="k">Harvest / mi²</span><span class="v">${(p.harvest_density || 0).toFixed(2)}</span></div>
    <div class="stat"><span class="k">Public land</span><span class="v">${p.public_pct ?? '—'}%</span></div>
    <div class="stat"><span class="k">Habitat score</span><span class="v">${p.habitat_score ?? '—'}</span></div>
    <div class="stat"><span class="k">Harvest score</span><span class="v">${p.harvest_score ?? '—'}</span></div>`;
  detail.classList.add('show');
  buildLayers();
  // fly to centroid
  const c = turf_center(u);
  map.flyTo({ center: c, zoom: Math.max(map.getZoom(), 8.5), pitch: Math.max(map.getPitch(), 45), duration: 900 });
}

function turf_center(f) {
  // bbox center
  const rings = f.geometry.type === 'Polygon' ? [f.geometry.coordinates[0]]
    : f.geometry.coordinates.map(p => p[0]);
  let xs = [], ys = [];
  rings.forEach(r => r.forEach(pt => { xs.push(pt[0]); ys.push(pt[1]); }));
  return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
}

function renderUnitList() {
  const list = document.getElementById('unitList');
  const rows = UNITS.features
    .map(f => f.properties)
    .filter(p => (p[metric] || 0) >= minScore)
    .sort((a, b) => (b[metric] || 0) - (a[metric] || 0))
    .slice(0, 50);
  list.innerHTML = rows.map(p => `
    <div class="unit-row ${p.gmuid === selectedGmu ? 'sel' : ''}" data-gmu="${p.gmuid}">
      <div class="gmu">${p.gmuid}</div>
      <div class="bar"><i style="width:${p[metric] || 0}%"></i></div>
      <div class="score">${Math.round(p[metric] || 0)}</div>
    </div>`).join('');
  list.querySelectorAll('.unit-row').forEach(el =>
    el.addEventListener('click', () => selectUnit(+el.dataset.gmu)));
}

// wire up UI
document.getElementById('metricSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#metricSeg button').forEach(x => x.classList.toggle('active', x === b));
  metric = b.dataset.m;
  document.getElementById('legendLabel').textContent = b.textContent + ' score';
  buildLayers();
});
const minScoreEl = document.getElementById('minScore');
minScoreEl.addEventListener('input', () => {
  minScore = +minScoreEl.value;
  document.getElementById('minScoreVal').textContent = minScore;
  buildLayers();
});
const extrudeEl = document.getElementById('extrude');
extrudeEl.addEventListener('input', () => {
  extrudeAmt = +extrudeEl.value / 100;
  document.getElementById('extrudeVal').textContent = extrudeEl.value;
  buildLayers();
});
document.getElementById('layerToggles').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  document.querySelectorAll('#layerToggles .chip').forEach(c => c.classList.toggle('on', c === chip));
  habitatLayer = chip.dataset.l;
  buildLayers();
});

map.on('load', async () => {
  const res = await fetch('/data/units.geojson');
  UNITS = await res.json();
  buildLayers();
});
</script>
</body>
</html>
